name: 1167 error

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.5  # Changed from 3.13.6 to 3.13.5
          cache: 'poetry'

      - name: Install poetry
        run: |
          pipx install poetry==2.0.1
          poetry --version

      - name: Install dependencies
        run: poetry install
      
 
      
     
