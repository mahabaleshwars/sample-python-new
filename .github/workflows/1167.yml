name: 1167 error

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Install poetry
        run: |
          pipx install poetry
          poetry --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.3
          cache: 'poetry'

      - name: Install dependencies
        run: poetry install
      
     
