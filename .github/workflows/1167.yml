name: 1167 error

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.6
          
      - name: Install Poetry using pip (not pipx)
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==2.1.4
          poetry --version
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.6
          cache: 'poetry'
          
      # - name: Set Poetry Python version
      #   run: |
      #     poetry env use python3.13
      #     poetry env info  # Debug: show which Python is being used
      - name: Install dependencies
        run: poetry install
      
     
