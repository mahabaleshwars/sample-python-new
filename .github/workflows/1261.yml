name: Test OS-Specific Python Caching by Docker (Reverse Order)

on:
  workflow_dispatch:

jobs:
  prepare-docker:
    runs-on: self-hosted
    name: Ensure Docker is available
    steps:
      - name: Detect privilege helper
        run: |
          if command -v sudo >/dev/null 2>&1; then
            echo "SUDO=sudo" >> "$GITHUB_ENV"
          else
            echo "SUDO=" >> "$GITHUB_ENV"
          fi

      - name: Install Docker if missing
        env:
          SUDO: ${{ env.SUDO }}
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            $SUDO apt-get update
            $SUDO apt-get install -y ca-certificates curl gnupg lsb-release
            $SUDO install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | $SUDO gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            $SUDO chmod a+r /etc/apt/keyrings/docker.gpg
            echo \
              "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
              $(lsb_release -cs) stable" | $SUDO tee /etc/apt/sources.list.d/docker.list > /dev/null
            $SUDO apt-get update
            $SUDO apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          fi

      - name: Start Docker daemon (no double-start, handles stale pid)
        env:
          SUDO: ${{ env.SUDO }}
        run: |
          set -euo pipefail

          # 1) Try systemd/service once
          SVC_STARTED=0
          if command -v systemctl >/dev/null 2>&1; then
            $SUDO systemctl start docker && SVC_STARTED=1 || true
          fi
          if [ $SVC_STARTED -eq 0 ]; then
            $SUDO service docker start && SVC_STARTED=1 || true
          fi

          # 2) Wait for Docker socket up (90s)
          for i in {1..90}; do
            if docker info >/dev/null 2>&1; then
              echo "Docker is up via service/systemd"
              exit 0
            fi
            sleep 1
          done

          echo "Service start did not bring Docker up; checking docker.pid"
          if [ -f /var/run/docker.pid ]; then
            PID=$(cat /var/run/docker.pid || true)
            if [ -n "$PID" ] && ps -p "$PID" >/dev/null 2>&1; then
              echo "dockerd running (pid $PID) but not responding; failing early"
              exit 1
            else
              echo "Stale /var/run/docker.pid found; removing"
              $SUDO rm -f /var/run/docker.pid
            fi
          fi

          # 3) Fallback: start dockerd manually (single instance)
          echo "Starting dockerd manually..."
          $SUDO nohup dockerd --host=unix:///var/run/docker.sock > /tmp/dockerd.log 2>&1 &

          for i in {1..90}; do
            if docker info >/dev/null 2>&1; then
              echo "Docker is up via manual dockerd"
              exit 0
            fi
            sleep 1
          done

          echo "Docker failed to start; dumping logs"
          if command -v journalctl >/dev/null 2>&1; then
            $SUDO journalctl -u docker --no-pager -n 200 || true
          fi
          if [ -f /tmp/dockerd.log ]; then
            tail -n 200 /tmp/dockerd.log || true
          fi
          exit 1

      - name: Show Docker info
        run: docker info

  ubuntu-24-04:
    needs: prepare-docker
    runs-on: self-hosted
    container:
      image: ubuntu:24.04
    name: Run inside Ubuntu 24.04 container
    steps:
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y curl build-essential libssl-dev libffi-dev python3-pip lsb-release
      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: 3.8
      - name: Verify Python Version
        run: |
          echo "Python: $(python --version)"
          echo "OS:"
          cat /etc/os-release

  ubuntu-20-04:
    needs: ubuntu-24-04
    runs-on: self-hosted
    container:
      image: ubuntu:20.04
    name: Run inside Ubuntu 20.04 container
    steps:
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y curl build-essential libssl-dev libffi-dev python3-pip lsb-release
      - name: Fix pip cache permissions
        run: |
          mkdir -p /github/home/.cache/pip
          chown -R $(whoami) /github/home/.cache
      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: 3.8
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Verify Python Version
        run: |
          echo "Python: $(python --version)"
          echo "OS:"
          cat /etc/os-release
