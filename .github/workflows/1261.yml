name:  Reproduce GLIBC Cache Issue (Issue 1261)

on:
  workflow_dispatch: 
    inputs:
      python_version: 
        description: 'Python version to test'
        required: true
        default: '3.14.1'

jobs: 
  # Job 1: Setup Python and cache it
  setup-and-cache-python: 
    name: Setup Python ${{ inputs.python_version }}
    runs-on: self-hosted
    steps: 
      - name:  Display OS and GLIBC Info
        run: |
          echo "=== System Information ==="
          cat /etc/os-release
          echo ""
          echo "GLIBC version: $(ldd --version | head -n1)"
          echo "Architecture: $(uname -m)"
          echo "Tool cache:  $RUNNER_TOOL_CACHE"
          
      - name: Clear Python cache (to force fresh download)
        run: |
          echo "Clearing cached Python ${{ inputs.python_version }}..."
          rm -rf "$RUNNER_TOOL_CACHE/Python/${{ inputs.python_version }}*" || true
          echo "Cache cleared"
          
      - name: Setup Python
        uses: actions/setup-python@v6
        with: 
          python-version:  ${{ inputs.python_version }}
          
      - name:  Verify Python installation
        run: |
          echo "=== Python Information ==="
          echo "Python location: $pythonLocation"
          python --version
          python -c "import sys; print(f'Executable: {sys.executable}')"
          python -c "import ssl; print(f'SSL version:  {ssl.OPENSSL_VERSION}')"
          
      - name: Check GLIBC requirements of Python binary
        run: |
          echo "=== GLIBC Requirements ==="
          ldd "$pythonLocation/bin/python3" 2>/dev/null || ldd "$pythonLocation/python" 2>/dev/null || echo "Could not check ldd"
          
      - name: Test pip
        run: |
          python -m pip --version
          python -m pip install --upgrade pip

  # Job 2: Use cached Python (run multiple times to catch intermittent failures)
  use-cached-python:
    name: Use cached Python (Run ${{ matrix.run }})
    runs-on: self-hosted
    needs: setup-and-cache-python
    strategy:
      fail-fast: false
      matrix:
        run:  [1, 2, 3]
    steps:
      - name: Display OS and GLIBC Info
        run: |
          echo "=== System Information (Run ${{ matrix. run }}) ==="
          cat /etc/os-release
          echo ""
          echo "GLIBC version: $(ldd --version | head -n1)"
          
      - name: Setup Python (should use cache)
        uses: actions/setup-python@v6
        with: 
          python-version:  ${{ inputs.python_version }}
          
      - name: Verify Python works
        run: |
          echo "=== Verification (Run ${{ matrix. run }}) ==="
          python --version
          python -c "import ssl; print(f'SSL module:  OK - {ssl.OPENSSL_VERSION}')"
          python -c "import hashlib; print('hashlib module:  OK')"
          
      - name: Test pip operations
        run: |
          python -m pip --version
          python -m pip install --upgrade pip
          python -m pip install requests --quiet
          python -c "import requests; print(f'requests installed: {requests.__version__}')"
