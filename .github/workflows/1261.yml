name: Repro GLIBC cache mismatch on self-hosted

on:
  workflow_dispatch:

env:
  PYTHON_VERSION_UNSTABLE: "3.14.1" # adjust if needed; any version that is present for both OS images works
  # IMPORTANT: Keep this label set to a runner that is a single machine to force cache reuse.
  RUNNER_LABELS: "[self-hosted, linux, x64, glibc-repro]"

jobs:
  prime-cache-ubuntu-24:
    name: Prime cache on ubuntu:24.04
    runs-on: ${{ fromJson(env.RUNNER_LABELS) }}
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v5
      - name: Show container OS
        run: |
          cat /etc/os-release
          ldd --version || true
      - name: Setup Python (prime cache on 24.04)
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION_UNSTABLE }}
          check-latest: false
      - run: |
          python --version
          python -c "import sys; print(sys.executable)"

  reproduce-on-ubuntu-20:
    name: Reuse cache on ubuntu:20.04 (should fail)
    runs-on: ${{ fromJson(env.RUNNER_LABELS) }}
    needs: prime-cache-ubuntu-24
    container:
      image: ubuntu:20.04
    steps:
      - uses: actions/checkout@v5
      - name: Show container OS
        run: |
          cat /etc/os-release
          ldd --version || true
      - name: Setup Python (reuses cached 24.04 build)
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION_UNSTABLE }}
          check-latest: false
      - name: Run Python (expected GLIBC failure)
        run: |
          set -x
          python --version
          python -c "print('hello from', __import__('platform').platform())"
