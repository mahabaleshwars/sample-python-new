name: Python(20 -> 24) caching AGENT_TOOLSDIRECTORY

on:
  workflow_dispatch: 
jobs:
  install-docker:
    runs-on: [self-hosted]
    name: Install Docker on self-hosted runner
    steps:
      - name: Check and Install Docker
        run:  |
          if ! command -v docker &> /dev/null; then
            echo "Docker not found, installing..."
            sudo apt-get update
            sudo apt-get install -y docker. io
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -aG docker $USER
            echo "Docker installed successfully"
          else
            echo "Docker is already installed"
            docker --version
          fi

      - name: Verify Docker is running
        run:  |
          sudo systemctl status docker --no-pager
          docker info

  ubuntu-20-04:
    needs: install-docker
    runs-on:  [self-hosted]
    container:
      image:  ubuntu:20.04
    name: Run inside Ubuntu 20.04 container
    steps: 
      - name:  Checkout repository
        uses: actions/checkout@v4

      - name: Set AGENT_TOOLSDIRECTORY
        run: echo "AGENT_TOOLSDIRECTORY=${{ runner. temp }}/tools-ubuntu-20-04" >> $GITHUB_ENV

      - name: Install deps
        run: |
          apt-get update
          apt-get install -y curl build-essential libssl-dev libffi-dev python3-pip lsb-release

      - name:  Fix pip cache permissions
        run: |
          mkdir -p /github/home/.cache/pip
          chown -R $(whoami) /github/home/. cache

      - name: Set up Python 3.14.1
        uses: actions/setup-python@v5
        with: 
          python-version: 3.14.1

      - name:  Verify Python Version
        run: |
          echo "Python:  $(python --version)"
          echo "OS:"
          cat /etc/os-release

  ubuntu-24-04:
    needs:  ubuntu-20-04
    runs-on:  [self-hosted]
    container: 
      image: ubuntu:24.04
    name: Run inside Ubuntu 24.04 container
    steps: 
      - name:  Checkout repository
        uses: actions/checkout@v4

      - name: Set AGENT_TOOLSDIRECTORY
        run: echo "AGENT_TOOLSDIRECTORY=${{ runner. temp }}/tools-ubuntu-24-04" >> $GITHUB_ENV

      - name: Install deps
        run: |
          apt-get update
          apt-get install -y curl build-essential libssl-dev libffi-dev python3-pip lsb-release

      - name:  Set up Python 3.14.1
        uses: actions/setup-python@v5
        with: 
          python-version:  3.14.1

      - name: Upgrade pip
        run:  python -m pip install --upgrade pip

      - name: Verify Python Version
        run: |
          echo "Python: $(python --version)"
          echo "OS:"
          cat /etc/os-release
