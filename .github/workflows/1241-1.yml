name: Test Python 3.14t on Windows ARM64

on:
  workflow_dispatch:

jobs:
  test-314-then-314t:
    name: Setup 3.14 then 3.14t (reproduces issue)
    runs-on: windows-11-arm
    steps:
      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: arm64
          allow-prereleases: true
      
      - name: Verify 3.14 installation
        shell: bash
        run: |
          echo "=== After installing 3.14 ==="
          python --version
          which python
      
      - name: Setup Python 3.14t (this should fail)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14t'
          architecture: arm64
          allow-prereleases: true
      
      - name: Check what happened
        shell: bash
        run: |
          echo "=== After attempting to install 3.14t ==="
          python --version
          which python

  test-314t-alone:
    name: Setup 3.14t alone (should work)
    runs-on: windows-11-arm
    steps:
      - name: Setup Python 3.14t
        uses: actions/setup-python@v5
        with:
          python-version: '3.14t'
          architecture: arm64
          allow-prereleases: true
      
      - name: Verify installation
        shell: bash
        run: |
          python --version
          python -c "import sys; print(f'GIL enabled: {sys._is_gil_enabled() if hasattr(sys, \"_is_gil_enabled\") else \"Unknown\"}')"
