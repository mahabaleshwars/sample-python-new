name: Enhanced Diagnostic - Python 3.14t on Windows ARM64

on:
  workflow_dispatch:

jobs:
  deep-diagnostic:
    name: Deep Diagnostic - Enhanced
    runs-on: windows-11-arm
    steps:
      - name: "[STEP 1] Install Python 3.14 (standard)"
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: arm64
          allow-prereleases: true
      
      - name: "[STEP 2] Detailed inspection after 3.14 installation"
        shell: pwsh
        run: |
          Write-Host "=== AFTER 3.14 INSTALLATION ===" -ForegroundColor Cyan
          
          $basePath = "C:\hostedtoolcache\windows\Python\3.14.0"
          
          if (Test-Path $basePath) {
            Write-Host "`n--- All subdirectories ---"
            Get-ChildItem $basePath -Directory | ForEach-Object {
              Write-Host "`nDirectory: $($_.Name)" -ForegroundColor Yellow
              
              Write-Host "  All .exe files:"
              Get-ChildItem $_.FullName -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
                $fullPath = $_.FullName
                $fileInfo = Get-Item $fullPath
                $isSymlink = $fileInfo.Attributes -band [System.IO.FileAttributes]::ReparsePoint
                
                if ($isSymlink) {
                  Write-Host "    [SYMLINK] $($_.Name)"
                  # Get symlink target
                  $target = (Get-Item $fullPath).Target
                  if ($target) {
                    Write-Host "      -> $target" -ForegroundColor Gray
                  }
                } else {
                  Write-Host "    [FILE] $($_.Name) ($($_.Length) bytes)"
                }
              }
            }
          }
      
      - name: "[STEP 3] Install Python 3.14t (will fail)"
        uses: actions/setup-python@v5
        continue-on-error: true
        id: install_14t
        with:
          python-version: '3.14t'
          architecture: arm64
          allow-prereleases: true
      
      - name: "[STEP 4] Capture and display setup.ps1 content"
        shell: pwsh
        run: |
          Write-Host "=== SETUP.PS1 SCRIPT ANALYSIS ===" -ForegroundColor Cyan
          
          $tempPath = "C:\a\_temp"
          $setupScripts = Get-ChildItem $tempPath -Filter "*.ps1" -ErrorAction SilentlyContinue
          
          if ($setupScripts.Count -gt 0) {
            # Get the most recent script (likely the one that just ran)
            $latestScript = $setupScripts | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            
            Write-Host "`nFound setup script: $($latestScript.Name)" -ForegroundColor Yellow
            Write-Host "Last modified: $($latestScript.LastWriteTime)"
            Write-Host "`n--- FULL SCRIPT CONTENT (lines 120-150) ---" -ForegroundColor Green
            
            $content = Get-Content $latestScript.FullName
            for ($i = 119; $i -lt 150 -and $i -lt $content.Length; $i++) {
              $lineNum = $i + 1
              Write-Host "$lineNum : $($content[$i])"
            }
            
            Write-Host "`n--- Searching for key patterns ---"
            $content | Select-String -Pattern "Remove-Item.*python\.exe|New-Item.*python.*\.exe|arm64-freethreaded" | ForEach-Object {
              Write-Host "Line $($_.LineNumber): $($_.Line)"
            }
          } else {
            Write-Host "No setup scripts found in temp directory"
          }
      
      - name: "[STEP 5] Check what actually happened"
        shell: pwsh
        run: |
          Write-Host "=== POST-FAILURE ANALYSIS ===" -ForegroundColor Cyan
          Write-Host "Installation outcome: ${{ steps.install_14t.outcome }}"
          
          $basePath = "C:\hostedtoolcache\windows\Python\3.14.0"
          
          Write-Host "`n--- Checking ALL directories under 3.14.0 ---"
          if (Test-Path $basePath) {
            Get-ChildItem $basePath -Directory | ForEach-Object {
              $dirName = $_.Name
              Write-Host "`n[$dirName]" -ForegroundColor Yellow
              
              $exeFiles = Get-ChildItem $_.FullName -Filter "*.exe" -ErrorAction SilentlyContinue
              
              if ($exeFiles.Count -eq 0) {
                Write-Host "  No .exe files found"
              } else {
                $exeFiles | ForEach-Object {
                  $fileInfo = Get-Item $_.FullName
                  $isSymlink = $fileInfo.Attributes -band [System.IO.FileAttributes]::ReparsePoint
                  
                  if ($isSymlink) {
                    $target = $fileInfo.Target
                    Write-Host "  [SYMLINK] $($_.Name) -> $target"
                  } else {
                    Write-Host "  [FILE] $($_.Name) (Size: $($_.Length))"
                  }
                }
              }
            }
          }
          
          Write-Host "`n--- Checking for arm64-freethreaded directory ---"
          $ftPath = "$basePath\arm64-freethreaded"
          if (Test-Path $ftPath) {
            Write-Host "✓ arm64-freethreaded directory EXISTS" -ForegroundColor Green
            Write-Host "Contents:"
            Get-ChildItem $ftPath -Recurse -Depth 1 | Select-Object FullName, Length, Mode | Format-Table -AutoSize
          } else {
            Write-Host "✗ arm64-freethreaded directory DOES NOT EXIST" -ForegroundColor Red
          }
      
      - name: "[STEP 6] Check Python commands availability"
        shell: pwsh
        run: |
          Write-Host "=== PYTHON COMMANDS CHECK ===" -ForegroundColor Cyan
          
          @("python.exe", "python3.exe", "python3.14.exe", "python3.14t.exe") | ForEach-Object {
            Write-Host "`nSearching for: $_"
            
            # Search in all Python 3.14 directories
            $found = Get-ChildItem "C:\hostedtoolcache\windows\Python\3.14.0" -Recurse -Filter $_ -ErrorAction SilentlyContinue
            
            if ($found) {
              $found | ForEach-Object {
                Write-Host "  ✓ Found: $($_.FullName)" -ForegroundColor Green
                
                # Try to run it
                try {
                  $version = & $_.FullName --version 2>&1
                  Write-Host "    Version: $version" -ForegroundColor Gray
                } catch {
                  Write-Host "    Error running: $_" -ForegroundColor Red
                }
              }
            } else {
              Write-Host "  ✗ Not found" -ForegroundColor Red
            }
          }

  control-test-314t-alone:
    name: Control - 3.14t Installation Alone
    runs-on: windows-11-arm
    steps:
      - name: "[CONTROL] Install 3.14t only"
        uses: actions/setup-python@v5
        with:
          python-version: '3.14t'
          architecture: arm64
          allow-prereleases: true
      
      - name: "[CONTROL] Inspect successful installation"
        shell: pwsh
        run: |
          Write-Host "=== SUCCESSFUL 3.14t INSTALLATION ===" -ForegroundColor Green
          
          $basePath = "C:\hostedtoolcache\windows\Python\3.14.0"
          
          Write-Host "`n--- What gets created when 3.14t installs successfully ---"
          Get-ChildItem $basePath -Directory | ForEach-Object {
            Write-Host "`nDirectory: $($_.Name)" -ForegroundColor Yellow
            Get-ChildItem $_.FullName -Filter "*.exe" | ForEach-Object {
              $fileInfo = Get-Item $_.FullName
              $isSymlink = $fileInfo.Attributes -band [System.IO.FileAttributes]::ReparsePoint
              
              if ($isSymlink) {
                Write-Host "  [SYMLINK] $($_.Name) -> $($fileInfo.Target)"
              } else {
                Write-Host "  [FILE] $($_.Name) ($($_.Length) bytes)"
              }
            }
          }
          
          Write-Host "`n--- Verification ---"
          python --version
          python -c "import sys; print(f'GIL disabled (free-threaded): {not sys._is_gil_enabled()}')"
