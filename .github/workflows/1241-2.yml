name: Compare Python 3.14/3.14t Layout (ARM64 vs x64)

on:
  workflow_dispatch:

jobs:
  debug-arm64:
    name: Debug ARM64 (Expected Fail)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Enable Debug Logging
        run: echo "ACTIONS_STEP_DEBUG=true" >> $GITHUB_ENV
        shell: bash

      - name: Pre-install File Check arm64
        shell: pwsh
        run: |
          $path = "C:\hostedtoolcache\windows\Python"
          Write-Host "Checking $path..."
          if (Test-Path $path) { Get-ChildItem -Path $path -Recurse | Select-Object FullName } else { Write-Host "Path not created yet." }

      - name: Setup Python 3.14 and 3.14t
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.14
            3.14t
          architecture: arm64
          allow-prereleases: true

      - name: Post-install Deep Analysis arm64
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== ROOT FOLDER STRUCTURE ==="
          Get-ChildItem -Path "C:\hostedtoolcache\windows\Python" -Recurse | Select-Object FullName
          
          Write-Host "`n=== SPECIFIC EXE CHECK ==="
          $versions = Get-ChildItem -Path "C:\hostedtoolcache\windows\Python" -Directory
          foreach ($v in $versions) {
              Write-Host "Checking inside $($v.FullName)"
              Get-ChildItem -Path $v.FullName -Recurse -Filter "*.exe" | Select-Object FullName, Length, LastWriteTime
          }

  debug-x64:
    name: Debug x64 (Control)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Debug Logging
        run: echo "ACTIONS_STEP_DEBUG=true" >> $GITHUB_ENV
        shell: bash

      - name: Pre-install File Check x64
        shell: pwsh
        run: |
          $path = "C:\hostedtoolcache\windows\Python"
          Write-Host "Checking $path..."
          if (Test-Path $path) { Get-ChildItem -Path $path -Recurse | Select-Object FullName } else { Write-Host "Path not created yet." }

      - name: Setup Python 3.14 and 3.14t
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.14
            3.14t
          architecture: x64
          allow-prereleases: true

      - name: Post-install Deep Analysis x64
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== ROOT FOLDER STRUCTURE ==="
          Get-ChildItem -Path "C:\hostedtoolcache\windows\Python" -Recurse | Select-Object FullName
          
          Write-Host "`n=== SPECIFIC EXE CHECK ==="
          $versions = Get-ChildItem -Path "C:\hostedtoolcache\windows\Python" -Directory
          foreach ($v in $versions) {
              Write-Host "Checking inside $($v.FullName)"
              Get-ChildItem -Path $v.FullName -Recurse -Filter "*.exe" | Select-Object FullName, Length, LastWriteTime
          }
