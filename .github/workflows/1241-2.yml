name: Test Python 3.14t on Windows ARM64

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Original job: Test freethreaded only (should work)
  test-single-version:
    name: Test 3.14t only
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Pre-Install Checks (Environment & Registry)
        shell: pwsh
        run: |
          Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') [test-single-version] Pre-install checks:"
          Write-Host "Environment Variables:"
          Get-ChildItem Env: | Where-Object { $_.Name -match "PYTHON|PATH|RUNNER" } | Format-Table -AutoSize
          Write-Host "Existing Python in PATH:"
          try { python --version } catch { Write-Host "No python in PATH" }
          Write-Host "Tool Cache Path:"
          Write-Host $env:AGENT_TOOLSDIRECTORY ?? $env:RUNNER_TOOL_CACHE
          Write-Host "Registry (Uninstall Keys):"
          Get-ChildItem -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue | Where-Object { $_.GetValue("DisplayName") -match "Python" } | ForEach-Object { Write-Host "$($_.Name): $($_.GetValue('DisplayName'))" }
          Write-Host "Installed Python Directories:"
          Get-ChildItem -Path "$($env:AGENT_TOOLSDIRECTORY ?? $env:RUNNER_TOOL_CACHE)\Python" -Recurse -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "3.14" } | Format-Table FullName
      
      - name: Setup Python 3.14t (free-threaded)
        uses: actions/setup-python@v6
        with:
          python-version: '3.14t'
          architecture: arm64
          allow-prereleases: true
      
      - name: Post-Install Checks (Files & Registry)
        shell: pwsh
        run: |
          Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') [test-single-version] Post-install checks:"
          Write-Host "Installed Python Files:"
          Get-ChildItem -Path "$($env:AGENT_TOOLSDIRECTORY ?? $env:RUNNER_TOOL_CACHE)\Python\3.14.0\arm64-freethreaded" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "python.*\.exe" } | Format-Table FullName, Length
          Write-Host "Registry After Install:"
          Get-ChildItem -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue | Where-Object { $_.GetValue("DisplayName") -match "Python" } | ForEach-Object { Write-Host "$($_.Name): $($_.GetValue('DisplayName'))" }
          Write-Host "PATH Includes Python:"
          $env:PATH -split ';' | Where-Object { $_ -match "Python" }
      
      - name: Verify Python installation
        shell: bash
        run: |
          echo "$(date +'%Y-%m-%d %H:%M:%S') [test-single-version] Verifying installation:"
          echo "Python version:"
          python --version
          echo ""
          echo "Python executable location:"
          which python
          echo ""
          echo "Python sys info:"
          python -c "import sys; print(f'Executable: {sys.executable}'); print(f'Version: {sys.version}')"
      
      - name: Test free-threading is enabled
        shell: bash
        run: |
          echo "$(date +'%Y-%m-%d %H:%M:%S') [test-single-version] Testing free-threading:"
          python -c "import sys; print(f'Free-threading enabled: {sys._is_gil_enabled() if hasattr(sys, \"_is_gil_enabled\") else \"Unknown\"}')"
      
      - name: Check what maturin can find
        shell: bash
        run: |
          echo "$(date +'%Y-%m-%d %H:%M:%S') [test-single-version] Testing maturin:"
          echo "=== Installing maturin ==="
          pip install maturin
          echo ""
          echo "=== Maturin list-python output ==="
          maturin list-python || echo "maturin list-python failed"

  # Original job: Test co-install (known to fail on ARM64)
  test-314-and-314t-together:
    name: Test 3.14 and 3.14t together (one step)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Pre-Install Checks (Environment & Registry)
        shell: pwsh
        run: |
          Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') [test-314-and-314t-together] Pre-install checks:"
          # Same as above (copy-paste for consistency)
          Write-Host "Environment Variables:"
          Get-ChildItem Env: | Where-Object { $_.Name -match "PYTHON|PATH|RUNNER" } | Format-Table -AutoSize
          Write-Host "Existing Python in PATH:"
          try { python --version } catch { Write-Host "No python in PATH" }
          Write-Host "Tool Cache Path:"
          Write-Host $env:AGENT_TOOLSDIRECTORY ?? $env:RUNNER_TOOL_CACHE
          Write-Host "Registry (Uninstall Keys):"
          Get-ChildItem -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue | Where-Object { $_.GetValue("DisplayName") -match "Python" } | ForEach-Object { Write-Host "$($_.Name): $($_.GetValue('DisplayName'))" }
          Write-Host "Installed Python Directories:"
          Get-ChildItem -Path "$($env:AGENT_TOOLSDIRECTORY ?? $env:RUNNER_TOOL_CACHE)\Python" -Recurse -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "3.14" } | Format-Table FullName
      
      - name: Setup Python 3.14 and 3.14t
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.14
            3.14t
          architecture: arm64
          allow-prereleases: true
        continue-on-error: true  # Allow failure to proceed to logging
      
      - name: Post-Install Checks (Files & Registry)
        shell: pwsh
        run: |
          Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') [test-314-and-314t-together] Post-install checks (even if setup failed):"
          Write-Host "Installed Python Files (Regular):"
          Get-ChildItem -Path "$($env:AGENT_TOOLSDIRECTORY ?? $env:RUNNER_TOOL_CACHE)\Python\3.14.0\arm64" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "python.*\.exe" } | Format-Table FullName, Length
          Write-Host "Installed Python Files (Freethreaded):"
          Get-ChildItem -Path "$($env:AGENT_TOOLSDIRECTORY ?? $env:RUNNER_TOOL_CACHE)\Python\3.14.0\arm64-freethreaded" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "python.*\.exe" } | Format-Table FullName, Length
          Write-Host "Registry After Install:"
          Get-ChildItem -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue | Where-Object { $_.GetValue("DisplayName") -match "Python" } | ForEach-Object { Write-Host "$($_.Name): $($_.GetValue('DisplayName'))" }
          Write-Host "PATH Includes Python:"
          $env:PATH -split ';' | Where-Object { $_ -match "Python" }
      
      - name: Verify Python installation
        shell: bash
        run: |
          echo "$(date +'%Y-%m-%d %H:%M:%S') [test-314-and-314t-together] Verifying installation (may fail):"
          echo "Default Python version:"
          python --version 2>&1 || echo "python command failed"
          echo ""
          echo "Python executable location:"
          which python 2>&1 || echo "which python failed"
          echo ""
          echo "Python sys info:"
          python -c "import sys; print(f'Executable: {sys.executable}'); print(f'Version: {sys.version}')" 2>&1 || echo "sys info failed"
          echo ""
          echo "=== Checking all installed Python versions ==="
          for py in python3.14 python3.14t; do
            echo ""
            echo "Testing $py:"
            if command -v $py &> /dev/null; then
              $py --version
              $py -c "import sys; print(f'  Executable: {sys.executable}')"
              $py -c "import sys; print(f'  Free-threading: {sys._is_gil_enabled() if hasattr(sys, \"_is_gil_enabled\") else \"N/A\"}')"
            else
              echo "  $py not found!"
            fi
          done

  # Original job: Test in separate matrix jobs (should work)
  test-separated-jobs:
    name: Test 3.14 and 3.14t in separate jobs
    runs-on: windows-11-arm
    strategy:
      matrix:
        python-version: ['3.14', '3.14t']
    steps:
      - uses: actions/checkout@v4
      
      - name: Pre-Install Checks (Environment & Registry)
        shell: pwsh
        run: |
          Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') [test-separated-jobs-${{ matrix.python-version }}] Pre-install checks:"
          # Same pre-checks as above
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64
          allow-prereleases: true
      
      - name: Post-Install Checks (Files & Registry)
        shell: pwsh
        run: |
          Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') [test-separated-jobs-${{ matrix.python-version }}] Post-install checks:"
          $arch = if ('${{ matrix.python-version }}' -eq '3.14t') { 'arm64-freethreaded' } else { 'arm64' }
          Write-Host "Installed Python Files ($arch):"
          Get-ChildItem -Path "$($env:AGENT_TOOLSDIRECTORY ?? $env:RUNNER_TOOL_CACHE)\Python\3.14.0\$arch" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "python.*\.exe" } | Format-Table FullName, Length
          # Same post-checks as above
      
      - name: Verify Python installation
        shell: bash
        run: |
          echo "$(date +'%Y-%m-%d %H:%M:%S') [test-separated-jobs-${{ matrix.python-version }}] Verifying installation:"
          echo "Python version:"
          python --version
          echo ""
          echo "Python executable location:"
          which python
          echo ""
          echo "Python sys info:"
          python -c "import sys; print(f'Executable: {sys.executable}'); print(f'Version: {sys.version}')"
          echo ""
          if [ "${{ matrix.python-version }}" == "3.14t" ]; then
            echo "Free-threading status:"
            python -c "import sys; print(f'Free-threading enabled: {sys._is_gil_enabled() if hasattr(sys, \"_is_gil_enabled\") else \"N/A\"}')"
          fi
      
      - name: Check what maturin can find
        shell: bash
        run: |
          echo "$(date +'%Y-%m-%d %H:%M:%S') [test-separated-jobs-${{ matrix.python-version }}] Testing maturin:"
          echo "=== Installing maturin ==="
          pip install maturin
          echo ""
          echo "=== Maturin list-python output ==="
          maturin list-python || echo "maturin list-python failed"

  # Original x64 jobs (unchanged except for added maturin in separated)
  test-x64-314-and-314t-together:
    name: Test 3.14 and 3.14t together on Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python 3.14 and 3.14t
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.14
            3.14t
          architecture: x64
          allow-prereleases: true
      
      - name: Verify Python installation
        shell: bash
        run: |
          echo "Default Python version:"
          python --version
          echo ""
          echo "Python executable location:"
          which python
          echo ""
          echo "Python sys info:"
          python -c "import sys; print(f'Executable: {sys.executable}'); print(f'Version: {sys.version}')"
          echo ""
          echo "=== Checking all installed Python versions ==="
          for py in python3.14 python3.14t; do
            echo ""
            echo "Testing $py:"
            if command -v $py &> /dev/null; then
              $py --version
              $py -c "import sys; print(f'  Executable: {sys.executable}')"
              $py -c "import sys; print(f'  Free-threading: {sys._is_gil_enabled() if hasattr(sys, \"_is_gil_enabled\") else \"N/A\"}')"
            else
              echo "  $py not found!"
            fi
          done
      
      - name: Check what maturin can find
        shell: bash
        run: |
          echo "=== Installing maturin ==="
          pip install maturin
          echo ""
          echo "=== Maturin list-python output ==="
          maturin list-python || echo "maturin list-python failed"

  test-x64-separated-jobs:
    name: Test 3.14 and 3.14t in separate jobs on Windows x64
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.14', '3.14t']
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          allow-prereleases: true
      
      - name: Verify Python installation
        shell: bash
        run: |
          echo "Python version:"
          python --version
          echo ""
          echo "Python executable location:"
          which python
          echo ""
          echo "Python sys info:"
          python -c "import sys; print(f'Executable: {sys.executable}'); print(f'Version: {sys.version}')"
          echo ""
          if [ "${{ matrix.python-version }}" == "3.14t" ]; then
            echo "Free-threading status:"
            python -c "import sys; print(f'Free-threading enabled: {sys._is_gil_enabled() if hasattr(sys, \"_is_gil_enabled\") else \"N/A\"}')"
          fi
      
      - name: Check what maturin can find
        shell: bash
        run: |
          echo "=== Installing maturin ==="
          pip install maturin
          echo ""
          echo "=== Maturin list-python output ==="
          maturin list-python || echo "maturin list-python failed"

  # NEW JOB: Inspect archives without installing (to check packaging)
  inspect-archives:
    name: Inspect Python Archives (ARM64)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Download and Extract Archives
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.14
            3.14t
          architecture: arm64
          allow-prereleases: true
        continue-on-error: true  # Extract even if install fails
      
      - name: List Extracted Files
        shell: pwsh
        run: |
          Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') [inspect-archives] Listing extracted files:"
          Write-Host "Temp Directory Contents:"
          Get-ChildItem -Path $env:TEMP -Recurse -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "python|setup" } | ForEach-Object {
            Write-Host "Dir: $($_.FullName)"
            Get-ChildItem -Path $_.FullName -File | Format-Table Name, Length
          }
          Write-Host "Tool Cache Python Dirs:"
          Get-ChildItem -Path "$($env:AGENT_TOOLSDIRECTORY ?? $env:RUNNER_TOOL_CACHE)\Python" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "python.*\.exe|\.msi|\.zip" } | Format-Table FullName, Name, Length
          Write-Host "Checking for python.exe in freethreaded:"
          Test-Path "$($env:AGENT_TOOLSDIRECTORY ?? $env:RUNNER_TOOL_CACHE)\Python\3.14.0\arm64-freethreaded\python.exe"
          Write-Host "Checking for python3.14t.exe in freethreaded:"
          Test-Path "$($env:AGENT_TOOLSDIRECTORY ?? $env:RUNNER_TOOL_CACHE)\Python\3.14.0\arm64-freethreaded\python3.14t.exe"

  # NEW JOB: Freethreaded first, then regular (you tested this manually)
  arm64-freethreaded-first-then-regular:
    name: ARM64 Freethreaded First, Then Regular
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Pre-Install Checks
        shell: pwsh
        run: |
          Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') [arm64-freethreaded-first-then-regular] Pre-install checks:"
          # Same as above
      
      - name: Setup Freethreaded Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14t'
          architecture: arm64
          allow-prereleases: true
      
      - name: Setup Regular Python (After Freethreaded)
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: arm64
          allow-prereleases: true
        continue-on-error: true
      
      - name: Post-Install Checks
        shell: pwsh
        run: |
          Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') [arm64-freethreaded-first-then-regular] Post-install checks:"
          # Same as co-install post-checks
      
      - name: Verify Both
        shell: bash
        run: |
          echo "$(date +'%Y-%m-%d %H:%M:%S') [arm64-freethreaded-first-then-regular] Verifying both:"
          # Same as co-install verify

  # NEW JOB: Regular first, then freethreaded (original failing scenario)
  arm64-regular-first-then-freethreaded:
    name: ARM64 Regular First, Then Freethreaded
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Pre-Install Checks
        shell: pwsh
        run: |
          Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') [arm64-regular-first-then-freethreaded] Pre-install checks:"
          # Same as above
      
      - name: Setup Regular Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: arm64
          allow-prereleases: true
      
      - name: Setup Freethreaded Python (After Regular)
        uses: actions/setup-python@v6
        with:
          python-version: '3.14t'
          architecture: arm64
          allow-prereleases: true
        continue-on-error: true
      
      - name: Post-Install Checks
        shell: pwsh
        run: |
          Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') [arm64-regular-first-then-freethreaded] Post-install checks:"
          # Same as co-install post-checks
      
      - name: Verify Both
        shell: bash
        run: |
          echo "$(date +'%Y-%m-%d %H:%M:%S') [arm64-regular-first-then-freethreaded] Verifying both:"
          # Same as co-install verify

  # NEW JOB: Debug co-install with retries and forced checks
  arm64-coinstall-debug:
    name: ARM64 Co-Install Debug
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Pre-Install Checks
        shell: pwsh
        run: |
          Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') [arm64-coinstall-debug] Pre-install checks:"
          # Same as above
      
      - name: Setup Both with Debug
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.14
            3.14t
          architecture: arm64
          allow-prereleases: true
        continue-on-error: true
      
      - name: Forced Registry Clean (Debug)
        shell: pwsh
        run: |
          Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') [arm64-coinstall-debug] Forced registry clean:"
          Get-ChildItem -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue | Where-Object { $_.GetValue("DisplayName") -match "Python 3.14" } | ForEach-Object { Write-Host "Removing $($_.Name)"; Remove-Item $_.PSPath -Recurse -Force -ErrorAction SilentlyContinue }
      
      - name: Retry Setup (If Failed)
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.14
            3.14t
          architecture: arm64
          allow-prereleases: true
        continue-on-error: true
      
      - name: Post-Install Checks
        shell: pwsh
        run: |
          Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') [arm64-coinstall-debug] Post-install checks:"
          # Same as above
      
      - name: Verify
        shell: bash
        run: |
          echo "$(date +'%Y-%m-%d %H:%M:%S') [arm64-coinstall-debug] Verifying:"
          # Same as co-install verify

  # NEW JOB: Parallel comparison of x64 vs ARM64 co-install
  x64-vs-arm64-comparison:
    name: X64 vs ARM64 Co-Install Comparison
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      
      - name: Pre-Install Checks
        shell: pwsh
        run: |
          Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') [x64-vs-arm64-comparison-${{ matrix.os }}] Pre-install checks:"
          # Same as above
      
      - name: Setup Both
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.14
            3.14t
          architecture: ${{ matrix.os == 'windows-11-arm' && 'arm64' || 'x64' }}
          allow-prereleases: true
        continue-on-error: true
      
      - name: Post-Install Checks
        shell: pwsh
        run: |
          Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') [x64-vs-arm64-comparison-${{ matrix.os }}] Post-install checks:"
          # Same as above
      
      - name: Verify
        shell: bash
        run: |
          echo "$(date +'%Y-%m-%d %H:%M:%S') [x64-vs-arm64-comparison-${{ matrix.os }}] Verifying:"
          # Same as co-install verify
