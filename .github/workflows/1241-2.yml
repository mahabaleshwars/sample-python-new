name: Test Python 3.14t on Windows ARM64

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-single-version:
    name: Test 3.14t only
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python 3. 14t (free-threaded)
        uses: actions/setup-python@v6
        with:
          python-version: '3.14t'
          architecture: arm64
          allow-prereleases: true
      
      - name: Show folder contents after installation
        shell: pwsh
        run: |
          Write-Host "=== PYTHON INSTALLATION FOLDER STRUCTURE ===" -ForegroundColor Green
          Write-Host ""
          Write-Host "Checking C:\hostedtoolcache\windows\Python:" -ForegroundColor Yellow
          if (Test-Path "C:\hostedtoolcache\windows\Python") {
            Get-ChildItem -Path "C:\hostedtoolcache\windows\Python" -Directory | ForEach-Object {
              Write-Host "  [$($_. Name)]"
              Get-ChildItem -Path $_. FullName -Directory | ForEach-Object {
                Write-Host "    - $($_.Name)"
                $pythonPath = Join-Path $_. FullName "python.exe"
                if (Test-Path $pythonPath) {
                  Write-Host "      ✓ python.exe found"
                } else {
                  Write-Host "      ✗ python.exe NOT found"
                  Write-Host "      Contents:"
                  Get-ChildItem -Path $_.FullName | ForEach-Object {
                    Write-Host "        - $($_.Name)"
                  }
                }
              }
            }
          } else {
            Write-Host "  Path not found!"
          }
          Write-Host ""
          Write-Host "Checking PATH entries containing Python:" -ForegroundColor Yellow
          $env:PATH -split ';' | Where-Object { $_ -match "python|tool" } | ForEach-Object {
            Write-Host "  $_"
            if (Test-Path $_) {
              Write-Host "    [EXISTS]"
              Get-ChildItem -Path $_ -ErrorAction SilentlyContinue | Select-Object -First 5 | ForEach-Object {
                Write-Host "      - $($_.Name)"
              }
            } else {
              Write-Host "    [DOES NOT EXIST]"
            }
          }
      
      - name: Verify Python installation
        shell: bash
        continue-on-error: true
        run: |
          echo "Python version:"
          python --version || echo "FAILED to run: python --version"
          echo ""
          echo "Python executable location:"
          which python || echo "FAILED to find python in PATH"
          echo ""
          echo "Python sys info:"
          python -c "import sys; print(f'Executable: {sys.executable}'); print(f'Version: {sys.version}')" || echo "FAILED to get sys info"
      
      - name: Test free-threading is enabled
        shell: bash
        continue-on-error: true
        run: |
          python -c "import sys; print(f'Free-threading enabled: {sys._is_gil_enabled() if hasattr(sys, \"_is_gil_enabled\") else \"Unknown\"}')" || echo "FAILED to test free-threading"

  test-314-and-314t-together:
    name: Test 3.14 and 3.14t together (one step)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python 3.14 and 3.14t
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.14
            3.14t
          architecture: arm64
          allow-prereleases: true
      
      - name: Show detailed folder contents after installation
        shell: pwsh
        run: |
          Write-Host "=== DETAILED PYTHON INSTALLATION STRUCTURE ===" -ForegroundColor Green
          Write-Host ""
          Write-Host "Tool cache root structure:" -ForegroundColor Yellow
          if (Test-Path "C:\hostedtoolcache\windows\Python") {
            $toolCachePath = "C:\hostedtoolcache\windows\Python"
            Get-ChildItem -Path $toolCachePath | ForEach-Object {
              Write-Host "📁 $($_.Name) [$($_.GetType(). Name)]"
              if ($_.PSIsContainer) {
                Get-ChildItem -Path $_.FullName | ForEach-Object {
                  Write-Host "  📁 $($_.Name)"
                  if ($_.PSIsContainer -and $_.Name -match "3\. 14") {
                    Write-Host "    Subdirectories:"
                    Get-ChildItem -Path $_. FullName -Directory | ForEach-Object {
                      Write-Host "      📁 $($_.Name)"
                      $binPath = Join-Path $_. FullName "bin"
                      $exePath = Join-Path $_. FullName "python.exe"
                      if (Test-Path $binPath) {
                        Write-Host "        └─ bin/ [EXISTS]"
                        Get-ChildItem -Path $binPath | Select-Object -First 5 | ForEach-Object {
                          Write-Host "          - $($_.Name)"
                        }
                      }
                      if (Test-Path $exePath) {
                        Write-Host "        └─ python.exe [EXISTS]"
                      }
                    }
                    Write-Host "    Files in root:"
                    Get-ChildItem -Path $_.FullName -File | Select-Object -First 10 | ForEach-Object {
                      Write-Host "      - $($_.Name)"
                    }
                  }
                }
              }
            }
          } else {
            Write-Host "Tool cache not found!"
          }
          
          Write-Host ""
          Write-Host "Detailed VERSION directories:" -ForegroundColor Yellow
          Get-ChildItem -Path "C:\hostedtoolcache\windows\Python" -Directory | ForEach-Object {
            Write-Host ""
            Write-Host "Version Directory: $($_.Name)" -ForegroundColor Cyan
            Get-ChildItem -Path $_. FullName | ForEach-Object {
              Write-Host "  Architecture: $($_.Name)"
              $archPath = $_.FullName
              Get-ChildItem -Path $archPath | ForEach-Object {
                Write-Host "    Build/Release: $($_.Name)"
                $buildPath = $_.FullName
                Write-Host "    Directory Tree:"
                Get-ChildItem -Path $buildPath -Recurse | Select-Object -First 30 | ForEach-Object {
                  $level = ($_. FullName.Split('\'). Count - $buildPath.Split('\').Count) * 2
                  $indent = " " * $level
                  if ($_.PSIsContainer) {
                    Write-Host "$indent📁 $($_.Name)/"
                  } else {
                    Write-Host "$indent📄 $($_.Name)"
                  }
                }
              }
            }
          }
      
      - name: Verify Python installation
        shell: bash
        continue-on-error: true
        run: |
          echo "=== DEFAULT PYTHON VERSION ==="
          echo "Python version:"
          python --version || echo "FAILED"
          echo ""
          echo "Python executable location:"
          which python || echo "FAILED"
          echo ""
          echo "Python sys info:"
          python -c "import sys; print(f'Executable: {sys.executable}'); print(f'Version: {sys.version}')" || echo "FAILED"
          echo ""
          echo "=== Checking all installed Python versions ==="
          for py in python3.14 python3.14t python python3; do
            echo ""
            echo "Testing $py:"
            if command -v $py &> /dev/null; then
              echo "  Location: $(which $py)"
              $py --version 2>&1 || echo "  Failed to get version"
              $py -c "import sys; print(f'  Executable: {sys.executable}')" 2>&1 || echo "  Failed to get sys. executable"
              $py -c "import sys; print(f'  Free-threading: {sys._is_gil_enabled() if hasattr(sys, \"_is_gil_enabled\") else \"N/A\"}')" 2>&1 || echo "  Failed to check free-threading"
            else
              echo "  ✗ NOT found in PATH"
            fi
          done

  test-separated-jobs:
    name: Test 3.14 and 3. 14t in separate jobs
    runs-on: windows-11-arm
    strategy:
      matrix:
        python-version: ['3.14', '3.14t']
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64
          allow-prereleases: true
      
      - name: Show installation folder for ${{ matrix.python-version }}
        shell: pwsh
        run: |
          Write-Host "=== PYTHON ${{ matrix.python-version }} INSTALLATION ===" -ForegroundColor Green
          Write-Host ""
          Write-Host "Tool cache contents:" -ForegroundColor Yellow
          if (Test-Path "C:\hostedtoolcache\windows\Python") {
            Get-ChildItem -Path "C:\hostedtoolcache\windows\Python" -Recurse -File -Filter "python.exe" | ForEach-Object {
              Write-Host "Found python.exe at: $($_. FullName)"
              $versionInfo = & $_.FullName --version 2>&1
              Write-Host "  Version info: $versionInfo"
            }
          }
          Write-Host ""
          Write-Host "PATH entries:" -ForegroundColor Yellow
          $env:PATH -split ';' | Where-Object { $_ -match "python|tool" } | ForEach-Object {
            Write-Host "  $_"
          }
      
      - name: Verify Python installation
        shell: bash
        continue-on-error: true
        run: |
          echo "=== Python ${{ matrix.python-version }} Verification ==="
          echo "Python version:"
          python --version || echo "FAILED"
          echo ""
          echo "Python executable location:"
          which python || echo "FAILED"
          echo ""
          echo "Python sys info:"
          python -c "import sys; print(f'Executable: {sys.executable}'); print(f'Version: {sys.version}')" || echo "FAILED"
          echo ""
          if [ "${{ matrix.python-version }}" == "3.14t" ]; then
            echo "Free-threading status:"
            python -c "import sys; print(f'Free-threading enabled: {sys._is_gil_enabled() if hasattr(sys, \"_is_gil_enabled\") else \"N/A\"}')" || echo "FAILED"
          fi

  test-x64-314-and-314t-together:
    name: Test 3.14 and 3.14t together on Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python 3. 14 and 3.14t
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.14
            3.14t
          architecture: x64
          allow-prereleases: true
      
      - name: Show folder contents after installation (x64)
        shell: pwsh
        run: |
          Write-Host "=== X64 PYTHON INSTALLATION STRUCTURE ===" -ForegroundColor Green
          Write-Host ""
          if (Test-Path "C:\hostedtoolcache\windows\Python") {
            $toolCachePath = "C:\hostedtoolcache\windows\Python"
            Get-ChildItem -Path $toolCachePath | ForEach-Object {
              Write-Host "📁 $($_.Name)"
              Get-ChildItem -Path $_. FullName | ForEach-Object {
                Write-Host "  📁 $($_.Name)"
                Get-ChildItem -Path $_. FullName | ForEach-Object {
                  Write-Host "    📁 $($_. Name)"
                  $pythonExe = Join-Path $_.FullName "python.exe"
                  if (Test-Path $pythonExe) {
                    Write-Host "      ✓ python.exe [EXISTS]"
                  } else {
                    Write-Host "      ✗ python.exe [MISSING]"
                  }
                }
              }
            }
          }
      
      - name: Verify Python installation
        shell: bash
        run: |
          echo "=== X64 PYTHON VERIFICATION ==="
          echo "Default Python version:"
          python --version
          echo ""
          echo "Python executable location:"
          which python
          echo ""
          echo "Python sys info:"
          python -c "import sys; print(f'Executable: {sys.executable}'); print(f'Version: {sys.version}')"
          echo ""
          echo "=== Checking all installed Python versions ==="
          for py in python3.14 python3.14t; do
            echo ""
            echo "Testing $py:"
            if command -v $py &> /dev/null; then
              $py --version
              $py -c "import sys; print(f'  Executable: {sys.executable}')"
              $py -c "import sys; print(f'  Free-threading: {sys._is_gil_enabled() if hasattr(sys, \"_is_gil_enabled\") else \"N/A\"}')"
            else
              echo "  $py not found!"
            fi
          done
      
      - name: Check what maturin can find
        shell: bash
        run: |
          echo "=== Installing maturin ==="
          pip install maturin
          echo ""
          echo "=== Maturin list-python output ==="
          maturin list-python || echo "maturin list-python failed"

  test-x64-separated-jobs:
    name: Test 3.14 and 3.14t in separate jobs on Windows x64
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.14', '3.14t']
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          allow-prereleases: true
      
      - name: Show installation folder for x64 ${{ matrix.python-version }}
        shell: pwsh
        run: |
          Write-Host "=== X64 PYTHON ${{ matrix.python-version }} INSTALLATION ===" -ForegroundColor Green
          if (Test-Path "C:\hostedtoolcache\windows\Python") {
            Get-ChildItem -Path "C:\hostedtoolcache\windows\Python" -Recurse -File -Filter "python.exe" | ForEach-Object {
              Write-Host "Found: $($_.FullName)"
              $versionInfo = & $_.FullName --version 2>&1
              Write-Host "  Version: $versionInfo"
            }
          }
      
      - name: Verify Python installation
        shell: bash
        run: |
          echo "=== X64 Python ${{ matrix.python-version }} Verification ==="
          python --version
          which python
          python -c "import sys; print(f'Executable: {sys. executable}'); print(f'Version: {sys.version}')"
          echo ""
          if [ "${{ matrix.python-version }}" == "3.14t" ]; then
            echo "Free-threading status:"
            python -c "import sys; print(f'Free-threading enabled: {sys._is_gil_enabled() if hasattr(sys, \"_is_gil_enabled\") else \"N/A\"}')"
          fi
      
      - name: Check what maturin can find
        shell: bash
        run: |
          echo "=== Installing maturin ==="
          pip install maturin
          echo ""
          echo "=== Maturin list-python output ==="
          maturin list-python || echo "maturin list-python failed"
