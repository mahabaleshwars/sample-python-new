        shell: powershell
        run: |
          Write-Host "=== Python Setup Status: ${{ steps.setup-python.outcome }} ==="
          Write-Host ""
          Write-Host "=== Full hostedtoolcache directory structure ==="
          if (Test-Path "C:\hostedtoolcache\windows\Python") {
            Get-ChildItem "C:\hostedtoolcache\windows\Python" -Recurse -ErrorAction SilentlyContinue | 
              Select-Object FullName, Length, LastWriteTime | 
              Format-Table -AutoSize
          } else {
            Write-Host "Python toolcache directory does not exist"
          }
          
          Write-Host ""
          Write-Host "=== All Python executables ==="
          Get-ChildItem "C:\hostedtoolcache\windows\Python" -Recurse -Filter "python*.exe" -ErrorAction SilentlyContinue |
            Select-Object FullName, Length |
            Format-Table -AutoSize
          
          Write-Host ""
          Write-Host "=== Architecture subdirectories ==="
          if (Test-Path "C:\hostedtoolcache\windows\Python\3.14. 0") {
            Get-ChildItem "C:\hostedtoolcache\windows\Python\3.14.0" -Directory -ErrorAction SilentlyContinue |
              Select-Object Name, LastWriteTime |
              Format-Table -AutoSize
          }
      
      - name: Verify Python installation
        if: steps.setup-python.outcome == 'success'
        shell: bash
        run: |
          echo "Default Python version:"
          python --version
          echo ""
          echo "Python executable location:"
          which python
          echo ""
          echo "Python sys info:"
          python -c "import sys; print(f'Executable: {sys.executable}'); print(f'Version: {sys.version}')"
          echo ""
          echo "=== Checking all installed Python versions ==="
          for py in python3.14 python3. 14t; do
            echo ""
            echo "Testing $py:"
            if command -v $py &> /dev/null; then
              $py --version
              $py -c "import sys; print(f'  Executable: {sys.executable}')"
              $py -c "import sys; print(f'  Free-threading: {sys._is_gil_enabled() if hasattr(sys, \"_is_gil_enabled\") else \"N/A\"}')"
            else
              echo "  $py not found!"
            fi
          done
      
      - name: Check what maturin can find
        if: steps.setup-python.outcome == 'success'
        shell: bash
        run: |
          echo "=== Installing maturin ==="
          pip install maturin
          echo ""
          echo "=== Maturin list-python output ==="
          maturin list-python || echo "maturin list-python failed"
      
      - name: Report failure
        if: steps.setup-python.outcome == 'failure'
        run: |
          echo "::error::Python setup failed - check diagnostic output above"
          exit 1

  test-x64-separated-jobs:
    name: Test 3.14 and 3.14t in separate jobs on Windows x64
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3. 14', '3.14t']
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python ${{ matrix.python-version }}
        id: setup-python
        continue-on-error: true
        uses: actions/setup-python@v6
        with:
