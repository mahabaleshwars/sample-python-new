name: Test Python 3.14t on Windows ARM64

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-single-version:
    name: Test 3.14t only
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python 3.14t (free-threaded)
        id: setup-python
        continue-on-error: true
        uses: actions/setup-python@v6
        with:
          python-version: '3.14t'
          architecture: arm64
          allow-prereleases: true
      
      - name: Inspect Python installation directory (always runs)
        if: always()
        shell: powershell
        run: |
          Write-Host "=== Python Setup Status: ${{ steps.setup-python. outcome }} ==="
          Write-Host ""
          Write-Host "=== Checking hostedtoolcache directory structure ==="
          if (Test-Path "C:\hostedtoolcache\windows\Python") {
            Get-ChildItem "C:\hostedtoolcache\windows\Python" -Recurse -ErrorAction SilentlyContinue | 
              Select-Object FullName, Length, LastWriteTime | 
              Format-Table -AutoSize
          } else {
            Write-Host "Python toolcache directory does not exist"
          }
          
          Write-Host ""
          Write-Host "=== Looking for all Python executables ==="
          Get-ChildItem "C:\hostedtoolcache\windows\Python" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
            Select-Object FullName, Length |
            Format-Table -AutoSize
          
          Write-Host ""
          Write-Host "=== Checking temp directory for downloaded archives ==="
          if (Test-Path "C:\a\_temp") {
            Get-ChildItem "C:\a\_temp" -Filter "*.zip" -ErrorAction SilentlyContinue |
              Select-Object Name, Length, LastWriteTime |
              Format-Table -AutoSize
          }
      
      - name: Verify Python installation
        if: steps.setup-python.outcome == 'success'
        shell: bash
        run: |
          echo "Python version:"
          python --version
          echo ""
          echo "Python executable location:"
          which python
          echo ""
          echo "Python sys info:"
          python -c "import sys; print(f'Executable: {sys. executable}'); print(f'Version: {sys.version}')"
      
      - name: Test free-threading is enabled
        if: steps.setup-python.outcome == 'success'
        shell: bash
        run: |
          python -c "import sys; print(f'Free-threading enabled: {sys._is_gil_enabled() if hasattr(sys, \"_is_gil_enabled\") else \"Unknown\"}')"
      
      - name: Report failure
        if: steps.setup-python.outcome == 'failure'
        run: |
          echo "::error::Python setup failed - check diagnostic output above"
          exit 1

  test-314-and-314t-together:
    name: Test 3.14 and 3. 14t together (one step)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Pre-installation directory check
        shell: powershell
        run: |
          Write-Host "=== Before Installation ==="
          if (Test-Path "C:\hostedtoolcache\windows\Python") {
            Get-ChildItem "C:\hostedtoolcache\windows\Python" -ErrorAction SilentlyContinue |
              Select-Object Name, LastWriteTime
          } else {
            Write-Host "Python toolcache directory does not exist yet"
          }
      
      - name: Setup Python 3.14 and 3.14t
        id: setup-python
        continue-on-error: true
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.14
            3.14t
          architecture: arm64
          allow-prereleases: true
      
      - name: Inspect Python installation directory (always runs)
        if: always()
        shell: powershell
        run: |
          Write-Host "=== Python Setup Status: ${{ steps.setup-python.outcome }} ==="
          Write-Host ""
          Write-Host "=== Full hostedtoolcache directory structure ==="
          if (Test-Path "C:\hostedtoolcache\windows\Python") {
            Get-ChildItem "C:\hostedtoolcache\windows\Python" -Recurse -ErrorAction SilentlyContinue | 
              Select-Object FullName, Length, LastWriteTime | 
              Format-Table -AutoSize
          } else {
            Write-Host "Python toolcache directory does not exist"
          }
          
          Write-Host ""
          Write-Host "=== All Python executables ==="
          Get-ChildItem "C:\hostedtoolcache\windows\Python" -Recurse -Filter "python*. exe" -ErrorAction SilentlyContinue |
            Select-Object FullName, Length |
            Format-Table -AutoSize
          
          Write-Host ""
          Write-Host "=== Architecture subdirectories ==="
          if (Test-Path "C:\hostedtoolcache\windows\Python\3.14. 0") {
            Get-ChildItem "C:\hostedtoolcache\windows\Python\3. 14.0" -Directory -ErrorAction SilentlyContinue |
              Select-Object Name, LastWriteTime |
              Format-Table -AutoSize
          }
          
          Write-Host ""
          Write-Host "=== Checking specific architecture paths ==="
          $paths = @(
            "C:\hostedtoolcache\windows\Python\3.14.0\arm64",
            "C:\hostedtoolcache\windows\Python\3.14.0\arm64-freethreaded"
          )
          foreach ($path in $paths) {
            Write-Host "`nPath: $path"
            if (Test-Path $path) {
              Write-Host "EXISTS - Contents:"
              Get-ChildItem $path -ErrorAction SilentlyContinue |
                Select-Object Name, Length |
                Format-Table -AutoSize
            } else {
              Write-Host "DOES NOT EXIST"
            }
          }
      
      - name: Verify Python installation
        if: steps.setup-python.outcome == 'success'
        shell: bash
        run: |
          echo "Default Python version:"
          python --version
          echo ""
          echo "Python executable location:"
          which python
          echo ""
          echo "Python sys info:"
          python -c "import sys; print(f'Executable: {sys.executable}'); print(f'Version: {sys.version}')"
          echo ""
          echo "=== Checking all installed Python versions ==="
          for py in python3.14 python3. 14t; do
            echo ""
            echo "Testing $py:"
            if command -v $py &> /dev/null; then
              $py --version
              $py -c "import sys; print(f'  Executable: {sys.executable}')"
              $py -c "import sys; print(f'  Free-threading: {sys._is_gil_enabled() if hasattr(sys, \"_is_gil_enabled\") else \"N/A\"}')"
            else
              echo "  $py not found!"
            fi
          done
      
      - name: Report failure
        if: steps.setup-python.outcome == 'failure'
        run: |
          echo "::error::Python setup failed - check diagnostic output above"
          exit 1

  test-separated-jobs:
    name: Test 3.14 and 3.14t in separate jobs
    runs-on: windows-11-arm
    strategy:
      matrix:
        python-version: ['3.14', '3.14t']
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python ${{ matrix.python-version }}
        id: setup-python
        continue-on-error: true
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64
          allow-prereleases: true
      
      - name: Inspect Python installation directory (always runs)
        if: always()
        shell: powershell
        run: |
          Write-Host "=== Python ${{ matrix.python-version }} Setup Status: ${{ steps.setup-python.outcome }} ==="
          Write-Host ""
          Write-Host "=== hostedtoolcache directory structure ==="
          if (Test-Path "C:\hostedtoolcache\windows\Python") {
            Get-ChildItem "C:\hostedtoolcache\windows\Python" -Recurse -ErrorAction SilentlyContinue | 
              Select-Object FullName, Length, LastWriteTime | 
              Format-Table -AutoSize
          } else {
            Write-Host "Python toolcache directory does not exist"
          }
          
          Write-Host ""
          Write-Host "=== All Python executables ==="
          Get-ChildItem "C:\hostedtoolcache\windows\Python" -Recurse -Filter "*. exe" -ErrorAction SilentlyContinue |
            Select-Object FullName, Length |
            Format-Table -AutoSize
      
      - name: Verify Python installation
        if: steps.setup-python.outcome == 'success'
        shell: bash
        run: |
          echo "Python version:"
          python --version
          echo ""
          echo "Python executable location:"
          which python
          echo ""
          echo "Python sys info:"
          python -c "import sys; print(f'Executable: {sys.executable}'); print(f'Version: {sys.version}')"
          echo ""
          if [ "${{ matrix.python-version }}" == "3.14t" ]; then
            echo "Free-threading status:"
            python -c "import sys; print(f'Free-threading enabled: {sys._is_gil_enabled() if hasattr(sys, \"_is_gil_enabled\") else \"N/A\"}')"
          fi
      
      - name: Report failure
        if: steps.setup-python.outcome == 'failure'
        run: |
          echo "::error::Python ${{ matrix.python-version }} setup failed - check diagnostic output above"
          exit 1

  test-x64-314-and-314t-together:
    name: Test 3. 14 and 3.14t together on Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python 3. 14 and 3.14t
        id: setup-python
        continue-on-error: true
        uses: actions/setup-python@v6
