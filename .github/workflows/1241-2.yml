name: Debug Python 3.14t Installation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  debug-arm64:
    name: Debug ARM64 Installation
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Pre-installation environment check
        shell: pwsh
        run: |
          Write-Host "=== SYSTEM INFORMATION ===" -ForegroundColor Green
          Write-Host "OS Version:"
          [System. Environment]::OSVersion
          Write-Host ""
          Write-Host "Processor Architecture:"
          [System.Environment]::GetEnvironmentVariable("PROCESSOR_ARCHITECTURE")
          Write-Host ""
          Write-Host "PATH before installation:"
          $env:PATH -split ';' | ForEach-Object { Write-Host "  $_" }
          Write-Host ""
          Write-Host "=== PYTHON INSTALLATIONS BEFORE SETUP ===" -ForegroundColor Green
          Write-Host "Checking common Python locations:"
          $locations = @(
            "$env:USERPROFILE\AppData\Local\Programs\Python",
            "$env:ProgramFiles\Python",
            "${env:ProgramFiles(x86)}\Python",
            "$env:LOCALAPPDATA\Programs\Python",
            "C:\hostedtoolcache\windows\Python"
          )
          foreach ($loc in $locations) {
            if (Test-Path $loc) {
              Write-Host "Found: $loc"
              Get-ChildItem -Path $loc -Directory | ForEach-Object {
                Write-Host "  - $_"
              }
            }
          }
      
      - name: Setup Python 3.14t with debug
        uses: actions/setup-python@v6
        with:
          python-version: '3.14t'
          architecture: arm64
          allow-prereleases: true
        env:
          ACTIONS_STEP_DEBUG: true
          ACTIONS_RUNNER_DEBUG: true
      
      - name: Post-installation analysis
        shell: pwsh
        run: |
          Write-Host "=== POST-INSTALLATION ANALYSIS ===" -ForegroundColor Green
          Write-Host ""
          Write-Host "PATH after installation:"
          $env:PATH -split ';' | ForEach-Object { Write-Host "  $_" }
          Write-Host ""
          Write-Host "=== PYTHON INSTALLATIONS AFTER SETUP ===" -ForegroundColor Green
          Write-Host "Tool cache location:"
          if (Test-Path "C:\hostedtoolcache\windows\Python") {
            Get-ChildItem -Path "C:\hostedtoolcache\windows\Python" -Recurse -Directory | 
              Where-Object { $_.Name -match "3\.14" } | 
              ForEach-Object { 
                Write-Host "Found: $($_. FullName)"
                if (Test-Path "$($_.FullName)\python.exe") {
                  Write-Host "  Has python.exe: YES"
                  & "$($_.FullName)\python.exe" --version 2>&1
                } else {
                  Write-Host "  Has python.exe: NO"
                }
              }
          }
          Write-Host ""
          Write-Host "=== CHECKING PYTHON COMMANDS ===" -ForegroundColor Green
          $pythonCommands = @("python", "python3", "python3.14", "python3.14t")
          foreach ($cmd in $pythonCommands) {
            Write-Host "Checking $cmd:"
            $pythonPath = Get-Command $cmd -ErrorAction SilentlyContinue
            if ($pythonPath) {
              Write-Host "  Found at: $($pythonPath.Source)"
              & $cmd --version 2>&1
            } else {
              Write-Host "  Not found in PATH"
            }
          }
      
      - name: Directory structure analysis
        shell: bash
        run: |
          echo "=== TOOL CACHE STRUCTURE ==="
          if [ -d "/c/hostedtoolcache/windows/Python" ]; then
            echo "Python tool cache contents:"
            find /c/hostedtoolcache/windows/Python -type d -name "*3.14*" 2>/dev/null | while read dir; do
              echo "Directory: $dir"
              echo "  Contents:"
              ls -la "$dir" 2>/dev/null | head -20
              echo ""
            done
          else
            echo "Tool cache not found at expected location"
          fi
          
          echo "=== CHECKING FOR PYTHON EXECUTABLES ==="
          find /c/hostedtoolcache -name "python*. exe" 2>/dev/null | grep -i "3\. 14" || echo "No Python 3.14 executables found"
      
      - name: Test Python execution
        shell: bash
        continue-on-error: true
        run: |
          echo "=== PYTHON EXECUTION TEST ==="
          echo "Attempting to run python:"
          python --version || echo "Failed to run python"
          echo ""
          echo "Python location from which:"
          which python || echo "Python not found in PATH"
          echo ""
          echo "Python sys info:"
          python -c "import sys; print(f'Executable: {sys.executable}'); print(f'Version: {sys. version}'); print(f'Platform: {sys.platform}')" || echo "Failed to get sys info"
          echo ""
          echo "Free-threading check:"
          python -c "import sys; print(f'Has _is_gil_enabled: {hasattr(sys, \"_is_gil_enabled\")}'); print(f'GIL enabled: {sys._is_gil_enabled() if hasattr(sys, \"_is_gil_enabled\") else \"Unknown\"}')" || echo "Failed to check free-threading"

  debug-x64-comparison:
    name: Debug x64 Installation (for comparison)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Pre-installation environment check
        shell: pwsh
        run: |
          Write-Host "=== SYSTEM INFORMATION ===" -ForegroundColor Green
          Write-Host "OS Version:"
          [System. Environment]::OSVersion
          Write-Host ""
          Write-Host "Processor Architecture:"
          [System.Environment]::GetEnvironmentVariable("PROCESSOR_ARCHITECTURE")
          Write-Host ""
          Write-Host "PATH before installation (first 10 entries):"
          $env:PATH -split ';' | Select-Object -First 10 | ForEach-Object { Write-Host "  $_" }
      
      - name: Setup Python 3.14t with debug
        uses: actions/setup-python@v6
        with:
          python-version: '3.14t'
          architecture: x64
          allow-prereleases: true
        env:
          ACTIONS_STEP_DEBUG: true
          ACTIONS_RUNNER_DEBUG: true
      
      - name: Post-installation analysis
        shell: pwsh
        run: |
          Write-Host "=== POST-INSTALLATION ANALYSIS ===" -ForegroundColor Green
          Write-Host ""
          Write-Host "Tool cache location:"
          if (Test-Path "C:\hostedtoolcache\windows\Python") {
            Get-ChildItem -Path "C:\hostedtoolcache\windows\Python" -Recurse -Directory | 
              Where-Object { $_. Name -match "3\.14" } | 
              ForEach-Object { 
                Write-Host "Found: $($_. FullName)"
                if (Test-Path "$($_.FullName)\python.exe") {
                  Write-Host "  Has python.exe: YES"
                  & "$($_.FullName)\python.exe" --version 2>&1
                } else {
                  Write-Host "  Has python.exe: NO"
                }
              }
          }
      
      - name: Test Python execution
        shell: bash
        run: |
          echo "=== PYTHON EXECUTION TEST ==="
          python --version
          which python
          python -c "import sys; print(f'Executable: {sys. executable}'); print(f'Version: {sys.version}'); print(f'Platform: {sys. platform}')"
          python -c "import sys; print(f'Free-threading enabled: {sys._is_gil_enabled() if hasattr(sys, \"_is_gil_enabled\") else \"Unknown\"}')"
