name: Test Toolkit Enhancement for Composite Actions
on:
  workflow_dispatch:

jobs:
  test-composite-actions:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]  # Start with Ubuntu, add others once working
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # Build enhanced toolkit
      - name: Build Enhanced Toolkit
        id: toolkit
        run: |
          echo "🔧 Building toolkit from enhancement/1035 branch..."
          git clone -b enhancement/1035 https://github.com/mahabaleshwars/toolkit.git toolkit
          cd toolkit
          
          # Check what's in the packages/glob directory
          echo "📁 Checking toolkit structure..."
          ls -la packages/glob/
          
          # Check for package.json and available scripts
          if [ -f "packages/glob/package.json" ]; then
            echo "📦 Package.json found. Available scripts:"
            cd packages/glob
            npm run || true
            
            echo "📦 Installing dependencies..."
            npm install
            
            # Try different build commands
            echo "🔨 Building glob package..."
            if npm run | grep -q "build"; then
              npm run build
            elif npm run | grep -q "compile"; then
              npm run compile
            elif [ -f "../../scripts/build" ]; then
              ../../scripts/build glob
            else
              # Try direct TypeScript compilation
              echo "Using direct TypeScript compilation..."
              if [ -f "tsconfig.json" ]; then
                npx tsc || npm run tsc || true
              fi
              # Check if lib directory exists (pre-built)
              if [ ! -d "lib" ]; then
                echo "⚠️  No lib directory found, checking dist..."
                if [ -d "dist" ]; then
                  echo "Found dist directory, using it as lib"
                  ln -s dist lib
                fi
              fi
            fi
            
            echo "📂 Checking build output..."
            ls -la lib/ 2>/dev/null || ls -la dist/ 2>/dev/null || echo "No build output found"
          else
            echo "❌ No package.json found in packages/glob"
            exit 1
          fi
          
          cd "${{ github.workspace }}"
          echo "toolkit-path=${{ github.workspace }}/toolkit" >> $GITHUB_OUTPUT
        shell: bash
      
      # Test the enhancement directly first
      - name: Test Enhancement Directly
        run: |
          echo "🧪 Testing the enhancement directly..."
          
          # Create test files
          mkdir -p test-action
          echo "pytest==7.4.3" > test-action/requirements.txt
          
          # Create and run test script
          cat > test-direct.js << 'EOF'
          const path = require('path');
          const fs = require('fs');
          
          // Try to load the glob module
          let glob;
          try {
            glob = require('./toolkit/packages/glob/lib/glob');
            console.log('✅ Loaded from lib/glob');
          } catch (e1) {
            try {
              glob = require('./toolkit/packages/glob/dist/glob');
              console.log('✅ Loaded from dist/glob');
            } catch (e2) {
              try {
                glob = require('./toolkit/packages/glob');
                console.log('✅ Loaded from package root');
              } catch (e3) {
                console.error('❌ Could not load glob module:', e3.message);
                process.exit(1);
              }
            }
          }
          
          async function test() {
            const workspaceDir = path.join(process.cwd(), 'workspace');
            const actionDir = path.join(process.cwd(), 'test-action');
            
            fs.mkdirSync(workspaceDir, { recursive: true });
            
            process.env.GITHUB_WORKSPACE = workspaceDir;
            process.env.GITHUB_ACTION_PATH = actionDir;
            
            console.log('\nTest 1: Without workingDirectory (should fail)');
            try {
              const hash1 = await glob.hashFiles(path.join(actionDir, 'requirements.txt'));
              console.log('Result:', hash1 || 'Empty (expected)');
            } catch (e) {
              console.log('Error:', e.message);
            }
            
            console.log('\nTest 2: With workingDirectory (should work)');
            try {
              const hash2 = await glob.hashFiles('requirements.txt', '', {
                workingDirectory: actionDir
              });
              console.log('Result:', hash2 ? `✅ ${hash2.substring(0, 16)}...` : '❌ Empty');
              
              if (!hash2) {
                console.error('❌ Enhancement not working!');
                process.exit(1);
              } else {
                console.log('\n✅ Enhancement is working!');
              }
            } catch (e) {
              console.log('Error:', e.message);
              // Check if it's because workingDirectory isn't supported
              if (e.message.includes('workingDirectory')) {
                console.error('❌ workingDirectory parameter not recognized');
              }
            }
          }
          
          test().catch(console.error);
          EOF
          
          node test-direct.js
        shell: bash
      
      # Create simplified composite actions
      - name: Create Simple Test Composite Action
        run: |
          mkdir -p .github/actions/simple-test
          
          cat > .github/actions/simple-test/requirements.txt << 'EOF'
          pytest==7.4.3
          black==23.11.0
          EOF
          
          cat > .github/actions/simple-test/action.yml << 'EOF'
          name: 'Simple Test'
          description: 'Simple test of toolkit enhancement'
          outputs:
            hash:
              description: 'Generated hash'
              value: ${{ steps.hash.outputs.hash }}
            result:
              description: 'Test result'
              value: ${{ steps.hash.outputs.result }}
          runs:
            using: 'composite'
            steps:
              - name: Test Hash Generation
                id: hash
                shell: bash
                run: |
                  echo "Testing hash generation..."
                  echo "Action path: ${{ github.action_path }}"
                  echo "Workspace: ${{ github.workspace }}"
                  
                  # Find the glob module
                  GLOB_PATH="${{ inputs.toolkit-path }}/packages/glob"
                  if [ -f "$GLOB_PATH/lib/glob.js" ]; then
                    GLOB_MODULE="$GLOB_PATH/lib/glob"
                  elif [ -f "$GLOB_PATH/dist/glob.js" ]; then
                    GLOB_MODULE="$GLOB_PATH/dist/glob"
                  elif [ -f "$GLOB_PATH/index.js" ]; then
                    GLOB_MODULE="$GLOB_PATH"
                  else
                    echo "❌ Could not find glob module"
                    echo "result=failed" >> $GITHUB_OUTPUT
                    exit 1
                  fi
                  
                  # Test hash generation
                  RESULT=$(node -e "
                    const glob = require('$GLOB_MODULE');
                    (async () => {
                      try {
                        const hash = await glob.hashFiles('requirements.txt', '', {
                          workingDirectory: '${{ github.action_path }}'
                        });
                        if (hash) {
                          console.log(hash);
                          process.exit(0);
                        } else {
                          console.log('EMPTY');
                          process.exit(1);
                        }
                      } catch(e) {
                        console.error('ERROR:', e.message);
                        process.exit(1);
                      }
                    })();
                  " 2>&1) || true
                  
                  echo "Result: $RESULT"
                  
                  if [[ "$RESULT" == ERROR* ]] || [[ "$RESULT" == "EMPTY" ]]; then
                    echo "❌ Failed to generate hash"
                    echo "hash=" >> $GITHUB_OUTPUT
                    echo "result=failed" >> $GITHUB_OUTPUT
                  else
                    echo "✅ Hash generated: ${RESULT:0:16}..."
                    echo "hash=$RESULT" >> $GITHUB_OUTPUT
                    echo "result=success" >> $GITHUB_OUTPUT
                  fi
          inputs:
            toolkit-path:
              description: 'Path to toolkit'
              required: true
          EOF
        shell: bash
      
      - name: Run Simple Test
        id: simple-test
        uses: ./.github/actions/simple-test
        with:
          toolkit-path: ${{ steps.toolkit.outputs.toolkit-path }}
      
      - name: Validate Results
        run: |
          echo "📊 Test Results"
          echo "==============="
          echo "Hash: ${{ steps.simple-test.outputs.hash }}"
          echo "Result: ${{ steps.simple-test.outputs.result }}"
          
          if [ "${{ steps.simple-test.outputs.result }}" == "success" ]; then
            echo "✅ SUCCESS! Toolkit enhancement is working!"
          else
            echo "❌ FAILED! Enhancement not working"
            exit 1
          fi
        shell: bash
