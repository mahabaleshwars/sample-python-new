name: Test Toolkit Enhancement for Composite Actions
on:
  workflow_dispatch:


jobs:
  test-composite-actions:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # Build enhanced toolkit
      - name: Build Enhanced Toolkit
        id: toolkit
        run: |
          echo "🔧 Building toolkit from enhancement/1035 branch..."
          git clone -b enhancement/1035 https://github.com/mahabaleshwars/toolkit.git toolkit
          cd toolkit
          
          # Check and build glob package
          echo "📁 Checking toolkit/packages/glob structure..."
          ls -la packages/glob/
          
          cd packages/glob
          echo "📦 Installing dependencies..."
          npm install
          
          # Check for TypeScript compilation
          if [ -f "tsconfig.json" ]; then
            echo "🔨 Compiling TypeScript..."
            npx tsc || echo "TypeScript compilation attempted"
          fi
          
          # Check what we have
          echo "📂 Checking for compiled files..."
          if [ -d "lib" ]; then
            echo "✅ lib directory found"
            ls -la lib/ | head -10
          elif [ -d "dist" ]; then
            echo "✅ dist directory found"
            ls -la dist/ | head -10
          else
            echo "⚠️ No compiled output found, checking source..."
            ls -la src/ 2>/dev/null | head -10
          fi
          
          cd "${{ github.workspace }}"
          TOOLKIT_FULL_PATH="${{ github.workspace }}/toolkit"
          echo "toolkit-path=${TOOLKIT_FULL_PATH}" >> $GITHUB_OUTPUT
          echo "✅ Toolkit path set to: ${TOOLKIT_FULL_PATH}"
        shell: bash
      
      # Direct test first (no composite action)
      - name: Test Enhancement Directly
        run: |
          echo "🧪 Direct test of enhancement..."
          
          # Create test structure
          mkdir -p workspace
          mkdir -p test-action
          echo "pytest==7.4.3" > test-action/requirements.txt
          echo "black==23.11.0" >> test-action/requirements.txt
          
          # Test script
          cat > test-enhancement.js << 'EOF'
          const path = require('path');
          const fs = require('fs');
          
          // Find and load glob module
          const toolkitPath = './toolkit/packages/glob';
          let glob;
          
          // Try different locations
          const possiblePaths = [
            path.join(toolkitPath, 'lib', 'glob.js'),
            path.join(toolkitPath, 'lib', 'index.js'),
            path.join(toolkitPath, 'dist', 'glob.js'),
            path.join(toolkitPath, 'dist', 'index.js'),
            path.join(toolkitPath, 'src', 'glob.ts'),
            path.join(toolkitPath, 'index.js'),
          ];
          
          console.log('Searching for glob module...');
          for (const p of possiblePaths) {
            if (fs.existsSync(p)) {
              console.log(`Found: ${p}`);
              try {
                if (p.endsWith('.ts')) {
                  console.log('TypeScript file found, need compiled version');
                  continue;
                }
                glob = require(path.resolve(p.replace('.js', '')));
                console.log('✅ Module loaded successfully');
                break;
              } catch (e) {
                console.log(`Failed to load: ${e.message}`);
              }
            }
          }
          
          if (!glob) {
            // Try loading the package directly
            try {
              glob = require(path.resolve(toolkitPath));
              console.log('✅ Loaded package directly');
            } catch (e) {
              console.error('❌ Could not load glob module');
              process.exit(1);
            }
          }
          
          async function runTests() {
            const workspaceDir = path.resolve('./workspace');
            const actionDir = path.resolve('./test-action');
            
            process.env.GITHUB_WORKSPACE = workspaceDir;
            process.env.GITHUB_ACTION_PATH = actionDir;
            
            console.log(`\nWorkspace: ${workspaceDir}`);
            console.log(`Action Dir: ${actionDir}`);
            console.log(`File exists: ${fs.existsSync(path.join(actionDir, 'requirements.txt'))}\n`);
            
            // Test 1: Old behavior
            console.log('Test 1: Without workingDirectory (should return empty)');
            const fullPath = path.join(actionDir, 'requirements.txt');
            const hash1 = await glob.hashFiles(fullPath);
            console.log(`Result: ${hash1 || 'Empty ✅ (expected)'}`);
            
            // Test 2: New behavior
            console.log('\nTest 2: With workingDirectory (should work)');
            const hash2 = await glob.hashFiles('requirements.txt', '', {
              workingDirectory: actionDir
            });
            
            if (hash2) {
              console.log(`Result: ✅ Hash generated: ${hash2.substring(0, 16)}...`);
              console.log('\n🎉 SUCCESS! Enhancement is working!');
            } else {
              console.log('Result: ❌ Empty (enhancement not working)');
              process.exit(1);
            }
          }
          
          runTests().catch(e => {
            console.error('Test error:', e.message);
            process.exit(1);
          });
          EOF
          
          node test-enhancement.js
        shell: bash
      
      # Create and test composite action
      - name: Create Test Composite Action
        run: |
          mkdir -p .github/actions/test-composite
          
          # Create requirements file
          cat > .github/actions/test-composite/requirements.txt << 'EOF'
          pytest==7.4.3
          black==23.11.0
          mypy==1.7.1
          EOF
          
          # Create composite action that uses absolute paths
          cat > .github/actions/test-composite/action.yml << 'EOF'
          name: 'Test Composite'
          description: 'Test toolkit enhancement'
          outputs:
            hash:
              description: 'Generated hash'
              value: ${{ steps.generate-hash.outputs.hash }}
            status:
              description: 'Test status'
              value: ${{ steps.generate-hash.outputs.status }}
          runs:
            using: 'composite'
            steps:
              - name: Show Environment
                shell: bash
                run: |
                  echo "Current directory: $(pwd)"
                  echo "GitHub Workspace: ${{ github.workspace }}"
                  echo "GitHub Action Path: ${{ github.action_path }}"
                  echo "Composite action files:"
                  ls -la ${{ github.action_path }} || echo "Action path not accessible"
                  
              - name: Generate Hash
                id: generate-hash
                shell: bash
                run: |
                  # Use the toolkit path from input
                  TOOLKIT_PATH="${{ github.workspace }}/toolkit"
                  ACTION_PATH="${{ github.action_path }}"
                  
                  # If action path is empty, use relative path
                  if [ -z "$ACTION_PATH" ]; then
                    ACTION_PATH="${{ github.workspace }}/.github/actions/test-composite"
                  fi
                  
                  echo "Toolkit path: $TOOLKIT_PATH"
                  echo "Action path: $ACTION_PATH"
                  echo "Requirements file: $ACTION_PATH/requirements.txt"
                  
                  # Check if files exist
                  if [ ! -f "$ACTION_PATH/requirements.txt" ]; then
                    echo "❌ requirements.txt not found at $ACTION_PATH"
                    echo "status=failed" >> $GITHUB_OUTPUT
                    exit 1
                  fi
                  
                  # Run the hash test
                  cd "${{ github.workspace }}"
                  
                  HASH_RESULT=$(node -e "
                    const path = require('path');
                    const glob = require('${TOOLKIT_PATH}/packages/glob');
                    
                    (async () => {
                      try {
                        const hash = await glob.hashFiles('requirements.txt', '', {
                          workingDirectory: '${ACTION_PATH}'
                        });
                        
                        if (hash) {
                          console.log(hash);
                        } else {
                          console.error('EMPTY');
                          process.exit(1);
                        }
                      } catch (e) {
                        console.error('ERROR:', e.message);
                        process.exit(1);
                      }
                    })();
                  " 2>&1) || echo "FAILED"
                  
                  if [[ "$HASH_RESULT" == "FAILED" ]] || [[ "$HASH_RESULT" == "EMPTY" ]] || [[ "$HASH_RESULT" == ERROR* ]]; then
                    echo "❌ Failed to generate hash: $HASH_RESULT"
                    echo "hash=" >> $GITHUB_OUTPUT
                    echo "status=failed" >> $GITHUB_OUTPUT
                  else
                    echo "✅ Hash generated: ${HASH_RESULT:0:16}..."
                    echo "hash=$HASH_RESULT" >> $GITHUB_OUTPUT
                    echo "status=success" >> $GITHUB_OUTPUT
                  fi
          EOF
        shell: bash
      
      - name: Run Composite Action Test
        id: composite-test
        uses: ./.github/actions/test-composite
      
      - name: Validate Results
        run: |
          echo "📊 Final Results"
          echo "==============="
          echo "Hash: ${{ steps.composite-test.outputs.hash }}"
          echo "Status: ${{ steps.composite-test.outputs.status }}"
          echo ""
          
          if [ "${{ steps.composite-test.outputs.status }}" == "success" ]; then
            echo "✅ SUCCESS! Composite action can now cache dependencies!"
            echo "The toolkit enhancement is working correctly."
          else
            echo "❌ FAILED! The enhancement is not working as expected."
            exit 1
          fi
        shell: bash
