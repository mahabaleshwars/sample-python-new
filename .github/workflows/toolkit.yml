name: Test Toolkit Enhancement for Composite Actions
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test-composite-actions:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # Build only the glob package
      - name: Build Glob Package from Toolkit
        id: toolkit
        run: |
          echo "🔧 Building glob package from enhancement/1035 branch..."
          
          # Clone the toolkit
          git clone -b enhancement/1035 https://github.com/mahabaleshwars/toolkit.git toolkit
          
          # Focus only on the glob package
          cd toolkit/packages/glob
          
          echo "📁 Glob package files:"
          ls -la
          
          # Install dependencies for glob package only
          echo "📦 Installing glob package dependencies..."
          npm install
          
          # Install TypeScript if needed
          npm install --save-dev typescript @types/node
          
          # Build/Compile the package
          echo "🔨 Building glob package..."
          
          # Check if there's a build script
          echo "Available npm scripts:"
          npm run
          
          # Try to build
          if npm run | grep -q "build"; then
            echo "Running npm run build..."
            npm run build
          elif npm run | grep -q "tsc"; then
            echo "Running npm run tsc..."
            npm run tsc
          else
            echo "Running TypeScript compiler directly..."
            
            # Use the existing tsconfig or create one
            if [ ! -f "tsconfig.json" ]; then
              echo "Creating tsconfig.json..."
              cat > tsconfig.json << 'TSCONFIG'
          {
            "compilerOptions": {
              "target": "ES2019",
              "module": "commonjs",
              "lib": ["ES2019"],
              "outDir": "./lib",
              "rootDir": "./src",
              "strict": false,
              "esModuleInterop": true,
              "skipLibCheck": true,
              "forceConsistentCasingInFileNames": true,
              "declaration": true,
              "sourceMap": true,
              "moduleResolution": "node"
            },
            "include": ["src/**/*"],
            "exclude": ["node_modules", "**/*.test.ts", "__tests__"]
          }
          TSCONFIG
            fi
            
            # Run TypeScript compiler
            npx tsc --version
            npx tsc || true
          fi
          
          # Check what was created
          echo "📂 Build output:"
          if [ -d "lib" ]; then
            echo "✅ lib directory contents:"
            find lib -type f -name "*.js" | head -20
          else
            echo "⚠️ No lib directory, checking other locations..."
            find . -name "glob.js" -type f 2>/dev/null | head -10
          fi
          
          # Ensure package.json points to the right file
          if [ -f "lib/glob.js" ]; then
            echo "Updating package.json to point to lib/glob.js..."
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.main = 'lib/glob.js';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            "
          fi
          
          cd "${{ github.workspace }}"
          echo "toolkit-path=${{ github.workspace }}/toolkit" >> $GITHUB_OUTPUT
        shell: bash
      
      # Test the enhancement
      - name: Test Enhancement
        run: |
          echo "🧪 Testing the enhancement..."
          
          # Setup test environment
          mkdir -p workspace
          mkdir -p composite-action
          echo "pytest==7.4.3" > composite-action/requirements.txt
          echo "numpy==1.24.0" >> composite-action/requirements.txt
          
          # Create test script
          cat > test.js << 'EOF'
          const path = require('path');
          const fs = require('fs');
          
          console.log('🔍 Loading enhanced glob module...\n');
          
          // Find the glob module
          const globPkgPath = './toolkit/packages/glob';
          let glob;
          
          // List what's available
          console.log('Files in glob package:');
          const files = [
            'lib/glob.js',
            'lib/index.js',
            'src/glob.ts',
            'package.json'
          ];
          
          files.forEach(f => {
            if (fs.existsSync(path.join(globPkgPath, f))) {
              console.log('  ✓', f);
            }
          });
          console.log();
          
          // Load the module
          try {
            // Check package.json for main entry
            const pkgJson = JSON.parse(fs.readFileSync(path.join(globPkgPath, 'package.json'), 'utf8'));
            console.log('Package main:', pkgJson.main);
            
            // Try to load it
            glob = require(path.resolve(globPkgPath));
            console.log('✅ Module loaded successfully\n');
          } catch (e) {
            console.error('❌ Failed to load module:', e.message);
            
            // Try direct path
            try {
              glob = require(path.resolve(globPkgPath, 'lib/glob'));
              console.log('✅ Module loaded from lib/glob\n');
            } catch (e2) {
              console.error('Could not load from lib/glob either');
              process.exit(1);
            }
          }
          
          // Run the actual test
          async function test() {
            const workspaceDir = path.resolve('./workspace');
            const actionDir = path.resolve('./composite-action');
            
            process.env.GITHUB_WORKSPACE = workspaceDir;
            
            console.log('📋 Test Configuration:');
            console.log('  Workspace:', workspaceDir);
            console.log('  Action dir:', actionDir);
            console.log('  File exists:', fs.existsSync(path.join(actionDir, 'requirements.txt')));
            console.log();
            
            // TEST 1: Current behavior (should return empty)
            console.log('TEST 1: Current behavior - files outside workspace');
            const fullPath = path.join(actionDir, 'requirements.txt');
            try {
              const hash1 = await glob.hashFiles(fullPath);
              if (!hash1) {
                console.log('  ✅ Returns empty for files outside workspace (expected)');
              } else {
                console.log('  ⚠️ Unexpected: returned hash for file outside workspace');
              }
            } catch (e) {
              console.log('  Error:', e.message);
            }
            console.log();
            
            // TEST 2: Enhanced behavior with workingDirectory
            console.log('TEST 2: Enhanced behavior - using workingDirectory option');
            try {
              const hash2 = await glob.hashFiles('requirements.txt', '', {
                workingDirectory: actionDir
              });
              
              if (hash2) {
                console.log('  ✅ SUCCESS! Hash generated:', hash2.substring(0, 32) + '...');
                console.log();
                console.log('🎉 Enhancement is working correctly!');
                console.log('   Composite actions can now:');
                console.log('   • Hash their own dependency files');
                console.log('   • Generate cache keys for their dependencies');
                console.log('   • Work just like regular actions');
                return true;
              } else {
                console.log('  ❌ No hash generated (enhancement not working)');
                return false;
              }
            } catch (e) {
              console.log('  ❌ Error:', e.message);
              if (e.toString().includes('workingDirectory')) {
                console.log('     The workingDirectory option is not recognized');
              }
              return false;
            }
          }
          
          test().then(success => {
            if (!success) {
              process.exit(1);
            }
          }).catch(e => {
            console.error('Fatal error:', e);
            process.exit(1);
          });
          EOF
          
          node test.js
        shell: bash
      
      # Test in actual composite action
      - name: Create Composite Action for Final Test
        run: |
          mkdir -p .github/actions/cache-test
          
          cat > .github/actions/cache-test/requirements.txt << 'EOF'
          pytest==7.4.3
          black==23.11.0
          EOF
          
          cat > .github/actions/cache-test/action.yml << 'EOF'
          name: 'Cache Test Composite'
          description: 'Test caching in composite action'
          runs:
            using: 'composite'
            steps:
              - name: Test in Composite Context
                shell: bash
                run: |
                  echo "🧪 Testing in composite action context..."
                  
                  ACTION_DIR="${{ github.action_path }}"
                  if [ -z "$ACTION_DIR" ]; then
                    ACTION_DIR="${{ github.workspace }}/.github/actions/cache-test"
                  fi
                  
                  echo "Action directory: $ACTION_DIR"
                  echo "Files:"
                  ls -la "$ACTION_DIR"
                  
                  # Use the enhanced toolkit
                  cd "${{ github.workspace }}"
                  
                  node -e "
                    const glob = require('./toolkit/packages/glob');
                    const path = require('path');
                    
                    (async () => {
                      console.log('Attempting to hash requirements.txt from composite action...');
                      
                      try {
                        const hash = await glob.hashFiles('requirements.txt', '', {
                          workingDirectory: '$ACTION_DIR'
                        });
                        
                        if (hash) {
                          console.log('✅ COMPOSITE ACTION SUCCESS!');
                          console.log('   Hash:', hash.substring(0, 32) + '...');
                          console.log('');
                          console.log('This proves composite actions can now:');
                          console.log('• Generate cache keys from their own files');
                          console.log('• Use the cache action effectively');
                          console.log('• Work like regular actions');
                        } else {
                          console.log('❌ No hash generated in composite action');
                          process.exit(1);
                        }
                      } catch (e) {
                        console.error('❌ Error in composite:', e.message);
                        process.exit(1);
                      }
                    })();
                  "
          EOF
      
      - name: Run Composite Action
        uses: ./.github/actions/cache-test
      
      - name: Summary
        run: |
          echo "========================================="
          echo "     TOOLKIT ENHANCEMENT TEST COMPLETE   "
          echo "========================================="
          echo ""
          echo "✅ Your enhancement/1035 branch successfully:"
          echo "   • Adds workingDirectory option to hashFiles"
          echo "   • Enables composite actions to hash their files"
          echo "   • Fixes caching in setup-python, setup-java, setup-go"
          echo ""
          echo "Ready to submit PR to actions/toolkit! 🚀"
