name: Test Toolkit Enhancement for Composite Actions
on:
  workflow_dispatch:


jobs:
  test-composite-actions:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # Build enhanced toolkit with proper compilation
      - name: Build Enhanced Toolkit
        id: toolkit
        run: |
          echo "🔧 Building toolkit from enhancement/1035 branch..."
          git clone -b enhancement/1035 https://github.com/mahabaleshwars/toolkit.git toolkit
          cd toolkit
          
          # First, check if there's a root-level build
          if [ -f "package.json" ]; then
            echo "📦 Installing toolkit root dependencies..."
            npm install
            
            # Check if there's a build script at root
            if npm run | grep -q "build"; then
              echo "🔨 Building entire toolkit..."
              npm run build
            fi
          fi
          
          # Now focus on glob package
          cd packages/glob
          echo "📁 Glob package structure:"
          ls -la
          
          # Install dependencies
          echo "📦 Installing glob package dependencies..."
          npm install
          
          # Build TypeScript
          echo "🔨 Compiling TypeScript..."
          
          # Method 1: Use npm script if available
          if npm run | grep -q "build"; then
            echo "Using npm run build..."
            npm run build
          elif npm run | grep -q "compile"; then
            echo "Using npm run compile..."
            npm run compile
          else
            # Method 2: Direct TypeScript compilation
            echo "Using direct TypeScript compilation..."
            
            # Ensure TypeScript is installed
            npm install --save-dev typescript
            
            # Create a basic tsconfig if it doesn't exist
            if [ ! -f "tsconfig.json" ]; then
              echo "Creating tsconfig.json..."
              cat > tsconfig.json << 'TSCONFIG'
          {
            "compilerOptions": {
              "target": "ES2019",
              "module": "commonjs",
              "lib": ["ES2019"],
              "outDir": "./lib",
              "rootDir": "./src",
              "strict": true,
              "esModuleInterop": true,
              "skipLibCheck": true,
              "forceConsistentCasingInFileNames": true,
              "declaration": true,
              "declarationMap": true,
              "sourceMap": true
            },
            "include": ["src/**/*"],
            "exclude": ["node_modules", "**/*.test.ts"]
          }
          TSCONFIG
            fi
            
            # Compile
            npx tsc
          fi
          
          # Verify compilation
          echo "📂 Checking compilation output..."
          if [ -d "lib" ]; then
            echo "✅ lib directory created:"
            ls -la lib/
          else
            echo "❌ No lib directory found"
            
            # Try to manually compile the main file
            echo "Attempting manual compilation of glob.ts..."
            npx tsc src/glob.ts --outDir lib --module commonjs --target ES2019
          fi
          
          # If still no lib, check for dist
          if [ ! -d "lib" ] && [ -d "dist" ]; then
            echo "Using dist as lib..."
            ln -s dist lib
          fi
          
          cd "${{ github.workspace }}"
          echo "toolkit-path=${{ github.workspace }}/toolkit" >> $GITHUB_OUTPUT
          echo "✅ Toolkit built at: ${{ github.workspace }}/toolkit"
        shell: bash
      
      # Direct test with better error handling
      - name: Test Enhancement Directly
        run: |
          echo "🧪 Testing the enhancement..."
          
          # Create test structure
          mkdir -p workspace
          mkdir -p test-action
          echo "pytest==7.4.3" > test-action/requirements.txt
          echo "black==23.11.0" >> test-action/requirements.txt
          
          # Enhanced test script
          cat > test-enhancement.js << 'EOF'
          const path = require('path');
          const fs = require('fs');
          
          console.log('Loading glob module...\n');
          
          const toolkitPath = './toolkit/packages/glob';
          let glob;
          
          // Check what files exist
          console.log('Available files in glob package:');
          const checkPaths = [
            'lib/glob.js',
            'lib/index.js', 
            'lib/glob.d.ts',
            'dist/glob.js',
            'dist/index.js',
            'src/glob.ts',
            'package.json'
          ];
          
          for (const file of checkPaths) {
            const fullPath = path.join(toolkitPath, file);
            if (fs.existsSync(fullPath)) {
              console.log(`  ✓ ${file}`);
            }
          }
          console.log();
          
          // Try to load the compiled module
          try {
            // Try lib/glob first
            if (fs.existsSync(path.join(toolkitPath, 'lib', 'glob.js'))) {
              glob = require(path.resolve(toolkitPath, 'lib', 'glob'));
              console.log('✅ Loaded from lib/glob.js\n');
            } else if (fs.existsSync(path.join(toolkitPath, 'lib', 'index.js'))) {
              glob = require(path.resolve(toolkitPath, 'lib'));
              console.log('✅ Loaded from lib/index.js\n');
            } else {
              // Try to load package directly
              glob = require(path.resolve(toolkitPath));
              console.log('✅ Loaded from package root\n');
            }
          } catch (e) {
            console.error('❌ Failed to load module:', e.message);
            console.log('\nAttempting to show package.json main field:');
            try {
              const pkg = JSON.parse(fs.readFileSync(path.join(toolkitPath, 'package.json'), 'utf8'));
              console.log('Main:', pkg.main);
            } catch (e2) {
              console.log('Could not read package.json');
            }
            process.exit(1);
          }
          
          // Run tests
          async function runTests() {
            const workspaceDir = path.resolve('./workspace');
            const actionDir = path.resolve('./test-action');
            
            process.env.GITHUB_WORKSPACE = workspaceDir;
            process.env.GITHUB_ACTION_PATH = actionDir;
            
            console.log('Test Setup:');
            console.log(`  Workspace: ${workspaceDir}`);
            console.log(`  Action Dir: ${actionDir}`);
            console.log(`  Requirements exists: ${fs.existsSync(path.join(actionDir, 'requirements.txt'))}\n`);
            
            // Test 1: Old behavior
            console.log('Test 1: Without workingDirectory (files outside workspace)');
            try {
              const fullPath = path.join(actionDir, 'requirements.txt');
              const hash1 = await glob.hashFiles(fullPath);
              console.log(`  Result: ${hash1 ? 'Unexpected hash' : '✅ Empty (expected)'}\n`);
            } catch (e) {
              console.log(`  Error: ${e.message}\n`);
            }
            
            // Test 2: New behavior with workingDirectory
            console.log('Test 2: With workingDirectory option');
            try {
              const hash2 = await glob.hashFiles('requirements.txt', '', {
                workingDirectory: actionDir
              });
              
              if (hash2) {
                console.log(`  Result: ✅ Hash generated: ${hash2.substring(0, 16)}...`);
                console.log('\n🎉 SUCCESS! Your enhancement is working correctly!');
                console.log('Composite actions can now cache their dependencies!');
              } else {
                console.log('  Result: ❌ Empty hash (enhancement not working)');
                process.exit(1);
              }
            } catch (e) {
              console.log(`  Error: ${e.message}`);
              if (e.message.includes('workingDirectory')) {
                console.log('  ❌ workingDirectory option not recognized');
              }
              process.exit(1);
            }
          }
          
          runTests().catch(e => {
            console.error('Fatal error:', e);
            process.exit(1);
          });
          EOF
          
          node test-enhancement.js
        shell: bash
      
      # Simple composite action test
      - name: Create Simple Composite Action
        run: |
          mkdir -p .github/actions/simple-composite
          
          echo "pytest==7.4.3" > .github/actions/simple-composite/requirements.txt
          
          cat > .github/actions/simple-composite/action.yml << 'EOF'
          name: 'Simple Composite Test'
          description: 'Minimal test of toolkit enhancement'
          outputs:
            result:
              description: 'Test result'
              value: ${{ steps.test.outputs.result }}
          runs:
            using: 'composite'
            steps:
              - name: Test Hash in Composite
                id: test
                shell: bash
                run: |
                  echo "Testing in composite action..."
                  
                  # This is the key test - can we hash files in the composite action directory?
                  ACTION_DIR="${{ github.action_path }}"
                  if [ -z "$ACTION_DIR" ]; then
                    ACTION_DIR="${{ github.workspace }}/.github/actions/simple-composite"
                  fi
                  
                  TOOLKIT_DIR="${{ github.workspace }}/toolkit/packages/glob"
                  
                  echo "Action directory: $ACTION_DIR"
                  echo "Files in action directory:"
                  ls -la "$ACTION_DIR"
                  
                  # Test with Node.js
                  node -e "
                    const glob = require('$TOOLKIT_DIR');
                    (async () => {
                      const hash = await glob.hashFiles('requirements.txt', '', {
                        workingDirectory: '$ACTION_DIR'
                      });
                      if (hash) {
                        console.log('✅ Hash in composite: ' + hash.substring(0, 16) + '...');
                        process.exit(0);
                      } else {
                        console.log('❌ No hash generated');
                        process.exit(1);
                      }
                    })().catch(e => {
                      console.error('Error:', e.message);
                      process.exit(1);
                    });
                  "
                  
                  if [ $? -eq 0 ]; then
                    echo "result=success" >> $GITHUB_OUTPUT
                  else
                    echo "result=failed" >> $GITHUB_OUTPUT
                  fi
          EOF
      
      - name: Run Composite Action
        id: composite-test
        uses: ./.github/actions/simple-composite
      
      - name: Final Results
        run: |
          echo "================================================"
          echo "               TEST RESULTS                    "
          echo "================================================"
          
          if [ "${{ steps.composite-test.outputs.result }}" == "success" ]; then
            echo "✅ SUCCESS! Composite actions can now cache their dependencies!"
            echo ""
            echo "Your toolkit enhancement allows composite actions to:"
            echo "  • Hash their own dependency files"
            echo "  • Generate proper cache keys"
            echo "  • Use caching just like regular actions"
            echo ""
            echo "This fixes the issues in setup-python, setup-java, and setup-go!"
          else
            echo "❌ The composite action test failed"
            echo "Check the logs above for details"
            exit 1
          fi
        shell: bash
