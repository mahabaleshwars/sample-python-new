name: Test Shared Cache Behavior
on:  workflow_dispatch

jobs: 
  test-both-architectures: 
    runs-on:  macos-latest
    steps:
      - name: Install Python arm64
        uses:  actions/setup-python@v6
        with: 
          python-version:  '3.13.10'
          architecture:  arm64
      
      - name: Check after arm64 install
        run: |
          echo "=== After arm64 install ==="
          ls -la $RUNNER_TOOL_CACHE/Python/3.13.10/ || echo "Folder not found"
      - name:  Check folder structure
        run: |
          echo "=== Tool Cache Structure ==="
          ls -laR $RUNNER_TOOL_CACHE/Python/ || echo "Python folder not found"
          echo "=== Looking for architecture folders ==="
          find $RUNNER_TOOL_CACHE/Python -type d -name "*" | head -50
      
      - name:  Install Python x64
        uses: actions/setup-python@v6
        with: 
          python-version: '3.13.10'
          architecture: x64
      - name:  Check folder structure
        run: |
          echo "=== Tool Cache Structure ==="
          ls -laR $RUNNER_TOOL_CACHE/Python/ || echo "Python folder not found"
          echo "=== Looking for architecture folders ==="
          find $RUNNER_TOOL_CACHE/Python -type d -name "*" | head -50
      - name: Check after x64 install (arm64 should still exist)
        run: |
          echo "=== After x64 install ==="
          ls -la $RUNNER_TOOL_CACHE/Python/3.13.10/
          echo ""
          echo "Expected: Both arm64/ and x64/ folders should exist"
          echo ""
          if [ -d "$RUNNER_TOOL_CACHE/Python/3.13.10/arm64" ] && [ -d "$RUNNER_TOOL_CACHE/Python/3.13.10/x64" ]; then
            echo "✅ SUCCESS: Both architecture folders exist!"
          else
            echo "❌ FAILURE: One or both architecture folders are missing!"
            exit 1
          fi
