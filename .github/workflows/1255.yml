name: Test Python Matrix Installation
on:  workflow_dispatch

jobs:
  install-python: 
    runs-on: self-hosted
    strategy:
      matrix:
        arch: [arm64, x64]
        version: ['3.12. 8']
     # max-parallel: 2  # Run in parallel to trigger the race condition
    
    steps:
      - name: Setup Python ${{ matrix.version }} (${{ matrix.arch }})
        uses: actions/setup-python@v6
        with: 
          python-version:  ${{ matrix.version }}
          architecture:  ${{ matrix.arch }}
      
      - name:  Check folder structure
        run: |
          echo "=== Tool Cache Structure ==="
          ls -laR $RUNNER_TOOL_CACHE/Python/ || echo "Python folder not found"
          echo "=== Looking for architecture folders ==="
          find $RUNNER_TOOL_CACHE/Python -type d -name "*" | head -50
