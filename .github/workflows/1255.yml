# Reproduction Workflow for actions/setup-python Issue #1255
# Purpose: Analyze the bug where setup. sh deletes major version directory 
#          instead of architecture-specific directory
# 
# Expected Behavior:  Each architecture's Python installation should coexist
# Actual Behavior: Installing one architecture deletes the other's installation

name: Reproduce Issue 1255 - Multi-Arch Python Setup Bug

on:
  workflow_dispatch: 
    inputs:
      python_version:
        description: 'Python version to test'
        required: true
        default: '3.11'
        type: string
      debug_mode:
        description: 'Enable extra verbose logging'
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: ${{ inputs.python_version || '3.11' }}
  # Common tool cache location (adjust if your runner uses a different path)
  AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache

jobs:
  # =============================================================================
  # JOB 1: Pre-flight Check - Inspect initial state of tool cache
  # =============================================================================
  preflight-inspection:
    name: "🔍 Pre-flight:  Inspect Tool Cache State"
    runs-on: self-hosted  # Must be self-hosted to reproduce
    outputs:
      initial_state: ${{ steps.capture-initial. outputs.state }}
    steps:
      - name: "📋 Environment Information"
        run:  |
          echo "=============================================="
          echo "🖥️  ENVIRONMENT DETAILS"
          echo "=============================================="
          echo "Hostname: $(hostname)"
          echo "OS: $(uname -a)"
          echo "Architecture: $(uname -m)"
          echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Runner Name: ${{ runner.name }}"
          echo "Runner OS: ${{ runner. os }}"
          echo "Runner Arch: ${{ runner. arch }}"
          echo "Python Version to Test: ${{ env.PYTHON_VERSION }}"
          echo "AGENT_TOOLSDIRECTORY: ${AGENT_TOOLSDIRECTORY:-'Not Set'}"
          echo "=============================================="

      - name: "📁 Capture Initial Tool Cache State"
        id: capture-initial
        run: |
          echo "=============================================="
          echo "📁 INITIAL TOOL CACHE STATE"
          echo "=============================================="
          
          TOOLCACHE="${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          PYTHON_CACHE="$TOOLCACHE/Python"
          
          echo "Tool Cache Root: $TOOLCACHE"
          echo "Python Cache:  $PYTHON_CACHE"
          echo ""
          
          if [ -d "$PYTHON_CACHE" ]; then
            echo "📂 Python cache exists.  Current structure:"
            echo "----------------------------------------------"
            find "$PYTHON_CACHE" -maxdepth 3 -type d | head -50
            echo ""
            echo "📊 Detailed listing with permissions and sizes:"
            ls -laR "$PYTHON_CACHE" 2>/dev/null | head -100
          else
            echo "⚠️  Python cache directory does not exist yet"
          fi
          
          # Save state for comparison
          echo "state=captured" >> $GITHUB_OUTPUT

      - name: "🧹 Optional: Clean Python Cache for Fresh Test"
        if:  ${{ inputs.debug_mode }}
        run: |
          echo "=============================================="
          echo "🧹 CLEANING PYTHON CACHE FOR FRESH TEST"
          echo "=============================================="
          
          TOOLCACHE="${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          PYTHON_CACHE="$TOOLCACHE/Python"
          VERSION_PATH="$PYTHON_CACHE/${{ env.PYTHON_VERSION }}"
          
          echo "Target version path: $VERSION_PATH"
          
          if [ -d "$VERSION_PATH" ]; then
            echo "Removing existing Python ${{ env.PYTHON_VERSION }} installations..."
            rm -rf "$VERSION_PATH"
            echo "✅ Cleaned successfully"
          else
            echo "ℹ️  No existing installation found for Python ${{ env. PYTHON_VERSION }}"
          fi

  # =============================================================================
  # JOB 2: Matrix Job - Install Python for Multiple Architectures
  # This is where the bug manifests - parallel installations conflict
  # =============================================================================
  matrix-python-setup:
    name:  "🐍 Setup Python - ${{ matrix.arch }}"
    needs: preflight-inspection
    runs-on: self-hosted  # Must be self-hosted to reproduce
    strategy:
      fail-fast: false  # Continue all jobs even if one fails
      max-parallel: 2   # Run in parallel to trigger the race condition
      matrix: 
        arch: [x64, arm64]  # Adjust based on your runner capabilities
    
    steps: 
      - name: "🏷️ Job Identification"
        run:  |
          echo "=============================================="
          echo "🏷️  JOB:  Python Setup for ${{ matrix.arch }}"
          echo "=============================================="
          echo "Matrix Arch: ${{ matrix. arch }}"
          echo "Job ID: ${{ github.job }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Attempt: ${{ github.run_attempt }}"
          echo "Start Time: $(date -u '+%Y-%m-%d %H:%M:%S. %3N UTC')"

      - name: "📸 BEFORE:  Snapshot Tool Cache State"
        id: before-snapshot
        run: |
          echo "=============================================="
          echo "📸 BEFORE SETUP-PYTHON:  Tool Cache Snapshot"
          echo "=============================================="
          
          TOOLCACHE="${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          PYTHON_CACHE="$TOOLCACHE/Python"
          VERSION_PATH="$PYTHON_CACHE/${{ env.PYTHON_VERSION }}"
          
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S.%3N UTC')"
          echo "Checking:  $VERSION_PATH"
          echo ""
          
          if
