name: Test LD_LIBRARY_PATH Persistence

on:  workflow_dispatch

jobs: 
  test: 
    runs-on: self-hosted
    steps:
      - name: Check LD_LIBRARY_PATH before setup
        run:  |
          echo "LD_LIBRARY_PATH before:  [$LD_LIBRARY_PATH]"
      
      - name:  Setup Python
        uses: actions/setup-python@v6
        with: 
          python-version:  '3.13'
      
      - name: Check LD_LIBRARY_PATH after setup
        run: |
          echo "LD_LIBRARY_PATH after: [$LD_LIBRARY_PATH]"
