name: 'Test Python Composite Action'
description: 'A composite action that tests cache-dependency-path with github.action_path'
runs:
  using:  'composite'
  steps:
    - name: Set up Python with cache from action directory
      uses: actions/setup-python@v5
      with: 
        python-version:  '3.11'
        cache:  'pip'
        # This is the problematic line - referencing requirements.txt from the action's directory
        cache-dependency-path:  ${{ github.action_path }}/requirements.txt

    - name: Install dependencies
      shell: bash
      run: pip install -r ${{ github.action_path }}/requirements.txt

    - name:  Verify installation
      shell: bash
      run: python -c "import requests; print('requests version:', requests.__version__)"
