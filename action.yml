name: 'Composite Action Example'
description: 'A composite action to checkout code and set up Node.js'
runs:
  using:  'composite'
  steps: 
    - name:  Checkout code
      uses: actions/checkout@v4  
    
    - name: Set up python
      uses: mahabaleshwars/setup-python@test/toolkit-pr
      with:
        python-version: '3.11'
        cache:  pip
        cache-dependency-path:  requirements.txt
        # Test the new hashFiles extended options: 
        # roots - specify allowed root directories for hashing
        # allowFilesOutsideWorkspace - opt-in to hash files outside roots
        # exclude - glob patterns to exclude from hashing
        hash-files-options:  |
          roots:
            - ${{ github.workspace }}
            - ${{ github.action_path }}
          allowFilesOutsideWorkspace: true
          exclude: 
            - '**/node_modules/**'
            - '**/__pycache__/**'
            - '**/*. pyc'
    
    - name:  pip install
      run: pip install -r requirements. txt
      shell: bash
    
    - name: Test hashFiles with extended options
      run:  |
        echo "Testing hashFiles extended options feature"
        echo "Workspace: ${{ github. workspace }}"
        echo "Action Path: ${{ github. action_path }}"
      shell: bash
